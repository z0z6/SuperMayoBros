name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle jest instalowany przez akcję - nie trzeba commitować gradle wrappera
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Upewnij się, że SDK 34 jest dostępne (na runnerach zwykle już jest)
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: maja-debug-apk
          path: app/build/outputs/apk/debug/*.apk

<!DOCTYPE html>

<head>

<script>
"use strict";
/* =====================================================================
   Maja: Łąkowa Przygoda – port z wersji na Androida (Kotlin) na HTML5 canvas
   ===================================================================== */
const TS = 16, LH = 14, PI = Math.PI;
const T = { AIR:0, GROUND:1, BRICK:2, QBLOCK:3, USED:4, HARD:5, PIPE_L:6, PIPE_R:7, COIN:8, LEAF:9, GATE:10 };
const K = { BEETLE:1, SNAIL:2, HORNET:3, SPIDER:4, BOSS:5, ALEK:6, HONEY:10, FLOWER:11, ONEUP:12, STAR:13, SHOT:20 };
const ST = { TITLE:0, INTRO:1, PLAY:2, DYING:3, CLEAR:4, OVER:5, WIN:6 };
const FONT = '"Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';

/* ------------------------------------------------------------ kolory */
const colCache = new Map();
function C(v) {                       // 0xAARRGGBB -> css
  let s = colCache.get(v);
  if (!s) {
    const a = ((v >>> 24) & 255) / 255;
    s = "rgba(" + ((v >> 16) & 255) + "," + ((v >> 8) & 255) + "," + (v & 255) + "," + (a === 1 ? 1 : a.toFixed(3)) + ")";
    colCache.set(v, s);
  }
  return s;
}
const col = (c) => (typeof c === "number" ? C(c) : c);
const WHITE = 0xFFFFFFFF, BLACK = 0xFF000000;

/* ------------------------------------------------------------ dźwięk */
const Sfx = {
  ctx: null, enabled: true,
  defs: {
    jump: [[280,35],[440,35],[620,50]], stomp: [[220,30],[120,60]], coin: [[900,40],[1350,100]],
    bump: [[140,60]], "break": [[300,25],[0,10],[200,30],[120,45]], item: [[400,40],[500,40],[600,40],[800,80]],
    grow: [[300,40],[400,40],[500,40],[600,40],[750,60]], shrink: [[700,40],[550,40],[400,40],[300,60]],
    die: [[500,90],[420,90],[340,90],[260,120],[160,220]], kick: [[700,30],[480,60]], shoot: [[800,25],[520,45]],
    clear: [[520,90],[660,90],[780,90],[1040,90],[780,90],[1040,250]], boss: [[160,100],[110,160]],
    oneup: [[660,70],[880,70],[1100,70],[1320,120]], tick: [[1200,12]]
  },
  unlock() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) {}
  },
  play(name) {
    if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
    const d = this.defs[name]; if (!d) return;
    try {
      const ctx = this.ctx, osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = "square";
      let t = ctx.currentTime;
      g.gain.setValueAtTime(0.05, t);
      for (const n of d) { osc.frequency.setValueAtTime(Math.max(n[0], 1), t); if (n[0] <= 0) { /* pauza */ } t += n[1] / 1000; }
      g.gain.setValueAtTime(0.05, t - 0.02);
      g.gain.linearRampToValueAtTime(0.0001, t);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(t + 0.02);
    } catch (e) {}
  }
};

/* ------------------------------------------------------------ poziomy */
class Level {
  constructor(code, name, w, theme) {
    this.code = code; this.name = name; this.w = w; this.theme = theme;
    this.tiles = []; for (let y = 0; y < LH; y++) this.tiles.push(new Int8Array(w));
    this.contents = new Map(); this.spawns = [];
    this.goalX = w - 12; this.time = 300; this.hasBoss = false; this.bossMin = 0; this.bossMax = 0;
  }
  get(x, y) { if (x < 0 || x >= this.w) return T.HARD; if (y < 0 || y >= LH) return T.AIR; return this.tiles[y][x]; }
  isSolid(t) { return (t >= 1 && t <= 7) || t === T.LEAF || t === T.GATE; }
  set(x, y, t) { if (x >= 0 && x < this.w && y >= 0 && y < LH) this.tiles[y][x] = t; }
  ground(x1, x2, top = 12) { for (let x = x1; x <= x2; x++) for (let y = top; y < LH; y++) this.tiles[y][x] = T.GROUND; }
  ceiling(rows) { for (let x = 0; x < this.w; x++) for (let y = 0; y < rows; y++) this.tiles[y][x] = T.GROUND; }
  brick(x, y) { this.set(x, y, T.BRICK); }
  brickRow(x, y, n) { for (let i = 0; i < n; i++) this.set(x + i, y, T.BRICK); }
  q(x, y, c) { this.set(x, y, T.QBLOCK); this.contents.set(y * this.w + x, c); }
  leaf(x, y, n) { for (let i = 0; i < n; i++) this.set(x + i, y, T.LEAF); }
  pipe(x, h) { for (let y = 12 - h; y < 12; y++) { this.set(x, y, T.PIPE_L); this.set(x + 1, y, T.PIPE_R); } }
  stairsUp(x, n) { for (let i = 0; i < n; i++) for (let y = 11 - i; y <= 11; y++) this.set(x + i, y, T.HARD); }
  stairsDown(x, n) { for (let i = 0; i < n; i++) for (let y = 12 - n + i; y <= 11; y++) this.set(x + i, y, T.HARD); }
  coin(x, y) { if (this.get(x, y) === T.AIR) this.set(x, y, T.COIN); }
  coinRow(x, y, n) { for (let i = 0; i < n; i++) this.coin(x + i, y); }
  gate(x) { for (let y = 2; y <= 11; y++) this.set(x, y, T.GATE); }
  mob(type, row, ...xs) { for (const x of xs) this.spawns.push({ type, x, y: row }); }
}

function makeLevel(i) { return [level1, level2, level3, level4][i](); }

/* ------------------------------------------------------------ logika gry */
class Ent {
  constructor(type, x, y, w, h) {
    this.type = type; this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0; this.dir = -1; this.alive = true; this.onGround = false; this.knocked = false;
    this.state = 0; this.timer = 0; this.hp = 1; this.baseX = 0; this.baseY = 0; this.range = 0; this.phase = 0; this.spin = 0;
  }
  get isEnemy() { return this.type >= 1 && this.type <= 5; }
}
const approach = (v, t, a) => (v < t ? Math.min(v + a, t) : Math.max(v - a, t));

class Game {
  constructor() {
    this.state = ST.TITLE; this.hero = 0; this.levelIdx = 0; this.lv = makeLevel(0);
    this.ents = []; this.parts = []; this.bumps = [];
    this.p = new Ent(0, 0, 0, 12, 14);
    this.big = 0; this.facing = 1; this.invuln = 0; this.starT = 0; this.anim = 0;
    this.camX = 0; this.viewW = 400; this.score = 0; this.coins = 0; this.lives = 3; this.time = 300;
    this.tState = 0; this.clearPhase = 0; this.clearWait = 0; this.playerHidden = false; this.paused = false;
    this.bossDead = false; this.frame = 0; this.coyote = 0; this.jbuf = 0;
    this.inLeft = false; this.inRight = false; this.inJump = false; this.inRun = false;
    this.prevJump = false; this.prevRun = false; this.jumpEdge = false; this.runEdge = false;
    this.best = 0;
  }

  startGame() { this.score = 0; this.coins = 0; this.lives = 3; this.big = 0; this.loadLevel(0); }
  tap(x) { if (this.state === ST.TITLE) { this.hero = x < this.viewW / 2 ? 0 : 1; this.startGame(); }
           else if (this.state === ST.OVER || this.state === ST.WIN) this.state = ST.TITLE; }

  loadLevel(idx) {
    this.levelIdx = idx; this.lv = makeLevel(idx);
    this.ents = []; this.parts = []; this.bumps = []; this.bossDead = false;
    for (const s of this.lv.spawns) this.ents.push(this.makeEnt(s));
    const p = this.p;
    p.h = this.big > 0 ? 28 : 14; p.x = 3 * TS; p.y = 12 * TS - p.h; p.vx = 0; p.vy = 0; p.onGround = false;
    this.camX = 0; this.time = this.lv.time; this.invuln = 0; this.starT = 0; this.playerHidden = false; this.facing = 1;
    this.state = ST.INTRO; this.tState = 120;
  }

  makeEnt(s) {
    let e;
    switch (s.type) {
      case K.BEETLE: e = new Ent(K.BEETLE, s.x * TS + 1, s.y * TS - 14, 14, 14); break;
      case K.SNAIL: e = new Ent(K.SNAIL, s.x * TS + 1, s.y * TS - 14, 14, 14); break;
      case K.HORNET: e = new Ent(K.HORNET, s.x * TS, s.y * TS, 14, 12); break;
      case K.SPIDER: e = new Ent(K.SPIDER, s.x * TS + 1, s.y * TS, 14, 14); break;
      case K.BOSS: e = new Ent(K.BOSS, s.x * TS, s.y * TS - 24, 28, 24); break;
      default: e = new Ent(K.ALEK, s.x * TS, s.y * TS - 16, 14, 16);
    }
    e.dir = -1;
    if (s.type === K.HORNET) { e.baseX = e.x; e.baseY = e.y; e.range = 48; e.phase = s.x; }
    else if (s.type === K.SPIDER) { e.baseY = e.y; e.range = this.lv.theme === 1 ? 116 : 44; e.phase = s.x * 0.7; }
    else if (s.type === K.BOSS) e.hp = 3;
    return e;
  }

  update() {
    this.frame++;
    this.jumpEdge = this.inJump && !this.prevJump; this.prevJump = this.inJump;
    this.runEdge = this.inRun && !this.prevRun; this.prevRun = this.inRun;
    switch (this.state) {
      case ST.INTRO: this.tState--; if (this.tState <= 0) this.state = ST.PLAY; break;
      case ST.PLAY: if (!this.paused) this.updatePlay(); break;
      case ST.DYING: this.updateDying(); break;
      case ST.CLEAR: this.updateClear(); break;
    }
  }

  updatePlay() {
    this.time -= 1 / 24;
    if (this.time <= 0) { this.die(); return; }
    if (this.invuln > 0) this.invuln--;
    if (this.starT > 0) this.starT--;
    this.updatePlayer();
    if (this.state !== ST.PLAY) return;
    for (let i = 0; i < this.ents.length; i++) this.updateEnt(this.ents[i]);
    this.playerVsEnts();
    this.ents = this.ents.filter(e => e.alive);
    for (const pt of this.parts) { pt.x += pt.vx; pt.y += pt.vy; if (pt.kind === 0) pt.vy += 0.3; pt.life--; }
    this.parts = this.parts.filter(pt => pt.life > 0);
    for (const b of this.bumps) b.t++;
    this.bumps = this.bumps.filter(b => b.t <= 8);
    this.updateCamera();
    if (this.state === ST.PLAY && this.p.x + this.p.w >= this.lv.goalX * TS + 6) this.startClear();
  }

  updateCamera() {
    const target = this.p.x + this.p.w / 2 - this.viewW * 0.45;
    if (target > this.camX) this.camX = target;
    this.camX = Math.min(Math.max(this.camX, 0), Math.max(0, this.lv.w * TS - this.viewW));
  }

  updatePlayer() {
    const p = this.p, lv = this.lv;
    const dirIn = (this.inRight ? 1 : 0) - (this.inLeft ? 1 : 0);
    const gucio = this.hero === 1;
    const maxS = this.inRun ? 2.5 : 1.5;
    const acc = this.inRun ? 0.07 : 0.05;
    const fric = gucio ? 0.03 : 0.07;
    const skid = gucio ? 0.09 : 0.16;
    if (dirIn !== 0) {
      this.facing = dirIn;
      if (p.vx * dirIn < 0) p.vx += dirIn * (p.onGround ? skid : 0.07);
      else if (Math.abs(p.vx) > maxS) p.vx = approach(p.vx, dirIn * maxS, 0.03);
      else p.vx = approach(p.vx, dirIn * maxS, p.onGround ? acc : 0.05);
    } else p.vx = approach(p.vx, 0, p.onGround ? fric : 0.01);

    if (this.jumpEdge) this.jbuf = 5; else if (this.jbuf > 0) this.jbuf--;
    if (p.onGround) this.coyote = 4; else if (this.coyote > 0) this.coyote--;
    if (this.jbuf > 0 && this.coyote > 0) {
      const boost = gucio ? 1.12 : 1;
      p.vy = -(4.0 + Math.abs(p.vx) * 0.3) * boost;
      p.onGround = false; this.coyote = 0; this.jbuf = 0;
      Sfx.play("jump");
    }
    const g = (p.vy < 0 && this.inJump) ? 0.15 : 0.44;
    p.vy = Math.min(p.vy + g, 4.8);

    if (this.moveX(p)) p.vx = 0;
    if (p.x < this.camX) { p.x = this.camX; if (p.vx < 0) p.vx = 0; }
    const maxX = lv.w * TS - p.w;
    if (p.x > maxX) p.x = maxX;
    this.moveY(p, true);

    if (p.y > LH * TS + 8) { this.die(); return; }
    if (this.big > 0 && p.h < 20 && this.free(p.x, p.y - 14, p.w, 14)) { p.y -= 14; p.h = 28; }
    this.anim += p.onGround ? Math.abs(p.vx) * 0.22 : 0.25;
    this.collectCoins();
    if (this.runEdge && this.big === 2) this.shoot();
  }

  free(x, y, w, h) {
    const l = Math.floor(x / TS), r = Math.floor((x + w - 0.01) / TS);
    const t = Math.floor(y / TS), b = Math.floor((y + h - 0.01) / TS);
    for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++) if (this.lv.isSolid(this.lv.get(tx, ty))) return false;
    return true;
  }

  collectCoins() {
    const p = this.p, lv = this.lv;
    const l = Math.floor(p.x / TS), r = Math.floor((p.x + p.w - 0.01) / TS);
    const t = Math.floor(p.y / TS), b = Math.floor((p.y + p.h - 0.01) / TS);
    for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++)
      if (lv.get(tx, ty) === T.COIN) { lv.set(tx, ty, T.AIR); this.addCoin(); }
  }

  addCoin() {
    this.coins++; this.score += 200; Sfx.play("coin");
    if (this.coins >= 100) { this.coins -= 100; this.lives++; Sfx.play("oneup"); }
  }

  shoot() {
    let n = 0; for (const e of this.ents) if (e.type === K.SHOT && e.alive) n++;
    if (n >= 2) return;
    const p = this.p;
    const s = new Ent(K.SHOT, this.facing > 0 ? p.x + p.w : p.x - 6, p.y + p.h * 0.4, 6, 6);
    s.dir = this.facing; this.ents.push(s); Sfx.play("shoot");
  }

  moveX(e) {
    if (e.vx === 0) return false;
    e.x += e.vx;
    const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - 0.01) / TS);
    const t = Math.floor(e.y / TS), b = Math.floor((e.y + e.h - 0.01) / TS);
    const tx = e.vx > 0 ? r : l;
    for (let ty = t; ty <= b; ty++) {
      if (this.lv.isSolid(this.lv.get(tx, ty))) { e.x = e.vx > 0 ? tx * TS - e.w : (tx + 1) * TS; return true; }
    }
    return false;
  }

  moveY(e, player) {
    e.onGround = false;
    e.y += e.vy;
    const lv = this.lv;
    const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - 0.01) / TS);
    const t = Math.floor(e.y / TS), b = Math.floor((e.y + e.h - 0.01) / TS);
    if (e.vy > 0) {
      for (let tx = l; tx <= r; tx++) if (lv.isSolid(lv.get(tx, b))) { e.y = b * TS - e.h; e.vy = 0; e.onGround = true; return true; }
    } else if (e.vy < 0) {
      let hit = -1;
      const cx = Math.floor((e.x + e.w / 2) / TS);
      if (lv.isSolid(lv.get(cx, t))) hit = cx;
      else for (let tx = l; tx <= r; tx++) if (lv.isSolid(lv.get(tx, t))) { hit = tx; break; }
      if (hit >= 0) { e.y = (t + 1) * TS; e.vy = 0; if (player) this.bumpBlock(hit, t); return true; }
    }
    return false;
  }

  bumpBlock(tx, ty) {
    const lv = this.lv, tile = lv.get(tx, ty);
    if (tile === T.QBLOCK) {
      const c = lv.contents.get(ty * lv.w + tx) || 0;
      lv.set(tx, ty, T.USED); this.bumps.push({ tx, ty, t: 0 }); this.spawnContent(tx, ty, c);
    } else if (tile === T.BRICK) {
      if (this.big > 0) { lv.set(tx, ty, T.AIR); this.breakParts(tx, ty, lv.theme); this.score += 50; Sfx.play("break"); }
      else { this.bumps.push({ tx, ty, t: 0 }); Sfx.play("bump"); }
    }
    for (const e of this.ents) {
      if (e.alive && !e.knocked && e.isEnemy && e.type !== K.BOSS && e.type !== K.SPIDER &&
          Math.abs(e.x + e.w / 2 - (tx * TS + 8)) < 12 && Math.abs(e.y + e.h - ty * TS) < 3) this.knock(e);
    }
  }

  spawnContent(tx, ty, c) {
    if (c === 0) { this.addCoin(); this.parts.push({ kind: 1, x: tx * TS + 4, y: ty * TS - 8, vx: 0, vy: -4, life: 28, color: 0 }); return; }
    const type = c === 1 ? (this.big === 0 ? K.HONEY : K.FLOWER) : c === 2 ? K.ONEUP : K.STAR;
    const it = new Ent(type, tx * TS + 1, ty * TS + 2, 14, 14);
    it.state = 1; it.timer = 16; it.dir = 1;
    this.ents.push(it); Sfx.play("item");
  }

  breakParts(tx, ty, theme) {
    const colr = theme === 1 ? 0xFF7A5A48 : theme === 3 ? 0xFFD9A03A : 0xFFC8743C;
    const xs = [-1.5, 1.5, -1, 1], ys = [-4.5, -4.5, -3, -3];
    for (let i = 0; i < 4; i++)
      this.parts.push({ kind: 0, x: tx * TS + (i % 2 === 0 ? 2 : 9), y: ty * TS + (i < 2 ? 2 : 9), vx: xs[i], vy: ys[i], life: 70, color: colr });
  }

  overlapP(e, m) {
    const p = this.p;
    return p.x < e.x + e.w - m && p.x + p.w > e.x + m && p.y < e.y + e.h - m && p.y + p.h > e.y + m;
  }
  overlapEE(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  knock(o) {
    o.knocked = true; o.vy = -3; o.vx = this.p.x < o.x ? 1 : -1; this.score += 100; Sfx.play("kick");
  }

  damageBoss(e) {
    if (e.timer > 0 || e.knocked) return;
    e.hp--; e.timer = 80; Sfx.play("boss");
    if (e.hp <= 0) { e.knocked = true; e.vy = -4; e.vx = 0.5; this.bossDead = true; this.score += 5000; this.openGate(); }
  }

  openGate() {
    const lv = this.lv;
    for (let y = 0; y < LH; y++) for (let x = 0; x < lv.w; x++)
      if (lv.tiles[y][x] === T.GATE) { lv.tiles[y][x] = T.AIR; this.breakParts(x, y, 3); }
  }

  updateEnt(e) {
    if (!e.alive) return;
    if (e.x + e.w < this.camX - 150) { e.alive = false; return; }
    if (e.x > this.camX + this.viewW + 24 && e.type < K.HONEY) return;
    if (e.knocked) {
      e.vy += 0.3; e.y += e.vy; e.x += e.vx; e.spin += 0.3;
      if (e.y > LH * TS + 40) e.alive = false;
      return;
    }
    const lv = this.lv;
    switch (e.type) {
      case K.BEETLE:
        if (e.state === -1) { e.timer--; if (e.timer <= 0) e.alive = false; return; }
        e.vx = e.dir * 0.5; e.vy = Math.min(e.vy + 0.3, 4);
        if (this.moveX(e)) e.dir = -e.dir;
        this.moveY(e, false);
        if (e.y > LH * TS + 16) e.alive = false;
        break;
      case K.SNAIL:
        if (e.timer > 0) e.timer--;
        e.vy = Math.min(e.vy + 0.3, 4);
        e.vx = e.state === 0 ? e.dir * 0.45 : e.state === 1 ? 0 : e.dir * 3;
        if (this.moveX(e)) { e.dir = -e.dir; if (e.state === 2) Sfx.play("bump"); }
        this.moveY(e, false);
        if (e.state === 2) for (const o of this.ents)
          if (o !== e && o.alive && !o.knocked && o.isEnemy && o.type !== K.BOSS && this.overlapEE(e, o)) this.knock(o);
        if (e.y > LH * TS + 16) e.alive = false;
        break;
      case K.HORNET:
        e.phase += 0.08; e.x += e.dir * 0.7;
        if (e.x - e.baseX > e.range) e.dir = -1; else if (e.x - e.baseX < -e.range) e.dir = 1;
        e.y = e.baseY + Math.sin(e.phase) * 18;
        break;
      case K.SPIDER:
        e.phase += 0.035; e.y = e.baseY + (1 - Math.cos(e.phase)) * 0.5 * e.range;
        break;
      case K.BOSS: {
        if (e.timer > 0) e.timer--;
        e.state++;
        e.vy = Math.min(e.vy + 0.3, 4.5);
        e.vx = e.dir * (0.6 + (3 - e.hp) * 0.3);
        if (this.moveX(e)) e.dir = -e.dir;
        const mn = lv.bossMin * TS, mx = lv.bossMax * TS;
        if (e.x < mn) { e.x = mn; e.dir = 1; }
        if (e.x + e.w > mx) { e.x = mx - e.w; e.dir = -1; }
        this.moveY(e, false);
        if (e.onGround && e.state >= 110) { e.vy = -5.2; e.state = 0; }
        break;
      }
      case K.HONEY: case K.FLOWER: case K.ONEUP: case K.STAR:
        if (e.state === 1) {
          e.y -= 1; e.timer--;
          if (e.timer <= 0) { e.state = 0; if (e.type === K.STAR) e.vy = -3; }
          return;
        }
        if (e.type !== K.FLOWER) {
          e.vx = e.dir * (e.type === K.STAR ? 1.0 : 0.7);
          e.vy = Math.min(e.vy + 0.25, 4);
          if (this.moveX(e)) e.dir = -e.dir;
          this.moveY(e, false);
          if (e.type === K.STAR && e.onGround) e.vy = -3.6;
        }
        if (e.y > LH * TS + 16) { e.alive = false; return; }
        if (this.overlapP(e, 0)) this.pickup(e);
        break;
      case K.SHOT:
        e.timer++;
        e.vx = e.dir * 3.4; e.vy = Math.min(e.vy + 0.28, 4);
        if (this.moveX(e)) { e.alive = false; return; }
        this.moveY(e, false);
        if (e.onGround) e.vy = -2.8;
        if (e.timer > 200 || e.x > this.camX + this.viewW + 20 || e.x < this.camX - 20 || e.y > LH * TS) { e.alive = false; return; }
        for (const o of this.ents) {
          if (o.alive && !o.knocked && o.isEnemy && this.overlapEE(e, o)) {
            if (o.type === K.BOSS) this.damageBoss(o); else this.knock(o);
            e.alive = false; break;
          }
        }
        break;
    }
  }

  pickup(e) {
    e.alive = false;
    switch (e.type) {
      case K.HONEY: if (this.big === 0) { this.big = 1; Sfx.play("grow"); } else Sfx.play("item"); this.score += 1000; break;
      case K.FLOWER: this.big = this.big === 0 ? 1 : 2; this.score += 1000; Sfx.play("grow"); break;
      case K.ONEUP: this.lives++; Sfx.play("oneup"); break;
      case K.STAR: this.starT = 600; this.score += 1000; Sfx.play("item"); break;
    }
  }

  playerVsEnts() {
    if (this.state !== ST.PLAY) return;
    const p = this.p;
    for (const e of this.ents) {
      if (!e.alive || e.knocked || !e.isEnemy || e.state === -1) continue;
      if (e.type === K.BOSS && e.timer > 0) continue;
      if (!this.overlapP(e, 1.5)) continue;
      const stomp = p.vy > 0 && (p.y + p.h) - e.y < 10 && e.type !== K.SPIDER;
      if (e.type === K.SNAIL && e.state === 1) {
        if (e.timer > 0) continue;
        if (stomp) this.stompEnemy(e); else this.kickShell(e);
        continue;
      }
      if (e.type === K.SNAIL && e.state === 2 && e.timer > 0) continue;
      if (this.starT > 0) { if (e.type === K.BOSS) this.damageBoss(e); else this.knock(e); continue; }
      if (stomp) this.stompEnemy(e); else this.hurt();
    }
  }

  kickShell(e) {
    e.state = 2; e.dir = (this.p.x + this.p.w / 2 < e.x + e.w / 2) ? 1 : -1; e.timer = 10; Sfx.play("kick");
  }

  stompEnemy(e) {
    const p = this.p;
    switch (e.type) {
      case K.BEETLE: e.state = -1; e.timer = 20; e.vx = 0; this.score += 100; break;
      case K.SNAIL:
        if (e.state === 0) { e.state = 1; e.h = 12; e.y += 2; e.timer = 10; this.score += 100; }
        else if (e.state === 1) { this.kickShell(e); this.score += 400; }
        else { e.state = 1; e.vx = 0; e.timer = 10; this.score += 100; }
        break;
      case K.HORNET: this.knock(e); break;
      case K.BOSS: this.damageBoss(e); break;
    }
    Sfx.play("stomp");
    p.vy = this.inJump ? -4.6 : -3.2;
    p.y = Math.min(p.y, e.y - p.h);
    p.onGround = false;
    if (e.type === K.BOSS) p.vx = p.x < e.x ? -1.6 : 1.6;
  }

  hurt() {
    if (this.invuln > 0 || this.starT > 0) return;
    if (this.big > 0) {
      this.big = 0;
      if (this.p.h > 20) { this.p.y += 14; this.p.h = 14; }
      this.invuln = 100; Sfx.play("shrink");
    } else this.die();
  }

  die() {
    if (this.state !== ST.PLAY) return;
    this.state = ST.DYING; this.tState = 0;
    this.p.vy = -5; this.big = 0; this.starT = 0;
    if (this.p.h > 20) { this.p.y += 14; this.p.h = 14; }
    Sfx.play("die");
  }

  updateDying() {
    this.tState++;
    if (this.tState > 25) { this.p.vy = Math.min(this.p.vy + 0.3, 5); this.p.y += this.p.vy; }
    if (this.tState > 160) {
      this.lives--;
      if (this.lives <= 0) this.endRun(ST.OVER); else this.loadLevel(this.levelIdx);
    }
  }

  endRun(st) {
    this.state = st;
    if (this.score > this.best) { this.best = this.score; try { localStorage.setItem("maja-best", String(this.best)); } catch (e) {} }
  }

  startClear() {
    const p = this.p;
    this.state = ST.CLEAR; this.clearPhase = 0; this.clearWait = 0;
    p.x = this.lv.goalX * TS + 7 - p.w; p.vx = 0; p.vy = 0; this.facing = 1;
    this.score += Math.max(100, Math.floor((12 * TS - p.y) / TS * 400));
    Sfx.play("clear");
  }

  updateClear() {
    const p = this.p;
    this.updateCamera();
    if (this.clearPhase === 0) {
      p.y += 1.6; this.anim += 0.2;
      if (p.y + p.h >= 12 * TS) { p.y = 12 * TS - p.h; p.x = this.lv.goalX * TS + 9; this.clearPhase = 1; }
    } else if (this.clearPhase === 1) {
      p.x += 1.3; this.anim += 0.25;
      if (p.x > (this.lv.goalX + 6) * TS) { this.clearPhase = 2; this.playerHidden = true; }
    } else if (this.time > 0) {
      const d = Math.min(this.time, 2);
      this.time -= d; this.score += Math.floor(d * 50);
      if (this.frame % 3 === 0) Sfx.play("tick");
    } else {
      this.clearWait++;
      if (this.clearWait > 70) {
        if (this.levelIdx + 1 >= LEVEL_COUNT) this.endRun(ST.WIN); else this.loadLevel(this.levelIdx + 1);
      }
    }
  }
}

  { top:0xFF6B8A2A, dirt:0xFF5A3A24, dirtDark:0xFF3F2616, brick:0xFF7A5A48, brickLine:0xFF4A3426, leaf:0xFF3E7A3A, leafDark:0xFF2B5A2A, hard:0xFF6A5A50 },
  { top:0xFF3E9A3A, dirt:0xFF6B4A2A, dirtDark:0xFF4B3018, brick:0xFFB06A3A, brickLine:0xFF7A4020, leaf:0xFF4CAF50, leafDark:0xFF2E7D32, hard:0xFF9A7A4A },
  { top:0xFFE0A820, dirt:0xFFB07A10, dirtDark:0xFF7A5008, brick:0xFFD9A03A, brickLine:0xFF8F5F10, leaf:0xFFE8B83A, leafDark:0xFFB88510, hard:0xFF8F5F10 }
];

const sky = skyDef.map(d => { const g = ctx.createLinearGradient(0, 0, 0, 224); g.addColorStop(0, C(d[0])); g.addColorStop(1, C(d[1])); return g; });
const hexPath = new Path2D();
for (let i = 0; i < 6; i++) {
  const a = (i * 60 - 30) * PI / 180, x = Math.cos(a) * 10, y = Math.sin(a) * 10;
  if (i === 0) hexPath.moveTo(x, y); else hexPath.lineTo(x, y);
}
hexPath.closePath();

function hash(n) {
  let x = (Math.imul(n, 374761393) + 668265263) | 0;
  x = Math.imul(x ^ (x >> 13), 1274126177);
  return (x ^ (x >> 16)) & 0x7fffffff;
}
function fill(x, y, w, h, c) { ctx.fillStyle = col(c); ctx.fillRect(x, y, w, h); }
function oval(x, y, w, h, c) { ctx.fillStyle = col(c); ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, PI * 2); ctx.fill(); }
function circ(cx, cy, r, c) { ctx.fillStyle = col(c); ctx.beginPath(); ctx.arc(cx, cy, r, 0, PI * 2); ctx.fill(); }
function ring(cx, cy, r, c, sw) { ctx.strokeStyle = col(c); ctx.lineWidth = sw; ctx.beginPath(); ctx.arc(cx, cy, r, 0, PI * 2); ctx.stroke(); }
function line(x1, y1, x2, y2, c, sw) { ctx.strokeStyle = col(c); ctx.lineWidth = sw; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, c) { ctx.fillStyle = col(c); ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function rrect(x, y, w, h, r, c) {
  ctx.fillStyle = col(c); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}
function rotAround(deg, px, py, fn) { ctx.save(); ctx.translate(px, py); ctx.rotate(deg * PI / 180); ctx.translate(-px, -py); fn(); ctx.restore(); }
let curFont = "";
function setFont(size) { const f = "600 " + size + "px " + FONT; if (f !== curFont) { ctx.font = f; curFont = f; } }
function txt(s, x, y, size, c, align = "left", shadow = true) {
  setFont(size); ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if (shadow) { ctx.fillStyle = "#000"; ctx.fillText(s, x + size * 0.07 + 0.5, y + size * 0.07 + 0.5); }
  ctx.fillStyle = col(c); ctx.fillText(s, x, y);
}
function measure(s, size) { setFont(size); return ctx.measureText(s).width; }

/* --- rozmiary, układ ekranu (marginesy ze sterowaniem) i wejście --- */
const PANEL = "#100d09";
let W = 1, H = 1, ratio = 1, qAdapt = 1;
let cssRect = { left: 0, top: 0, width: 1, height: 1 };
let isTouch = window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : (navigator.maxTouchPoints > 0);
let layoutMode = "split";                      // "split": ◀ + SKOK z lewej, ▶ + STRZAŁ z prawej; "classic": ruch z lewej, akcje z prawej
try { if (localStorage.getItem("maja-layout") === "classic") layoutMode = "classic"; } catch (e) {}
const L = { gx: 0, gy: 0, gw: 1, gh: 1, sc: 1, buttons: [] };
const fsOK = () => !!(document.fullscreenEnabled && cv.requestFullscreen);

function resize() {
  const r = cv.getBoundingClientRect();
  cssRect = r;
  const cw = Math.max(1, r.width), ch = Math.max(1, r.height);
  // Ograniczamy rozdzielczość bufora: mniej pikseli = płynniej i mniejsze opóźnienie w WebView
  let q = Math.min(window.devicePixelRatio || 1, 2);
  q = Math.min(q, Math.sqrt(0.9e6 / (cw * ch)));
  q = Math.max(0.5, q * qAdapt);
  const nw = Math.max(1, Math.round(cw * q)), nh = Math.max(1, Math.round(ch * q));
  if (cv.width !== nw || cv.height !== nh) { cv.width = nw; cv.height = nh; curFont = ""; }
  W = cv.width; H = cv.height; ratio = W / cw;
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

function btn(B, id, x, y, w, h, label, small) { B.push({ id, x, y, w, h, label, small: !!small }); }

function computeLayout() {
  const MIN_VW = 330, B = [];
  let sc, vw, gx = 0, gy = 0;
  const landscape = W > H * 1.25;
  if (isTouch && landscape) {
    // marginesy po bokach: [ sterowanie | gra | sterowanie ]
    let m = (W - H * 1.6) / 2;
    m = Math.min(Math.max(m, W * 0.15), W * 0.27);
    const aw = W - 2 * m;
    sc = H / 224; vw = aw / sc;
    if (vw < MIN_VW) { sc = aw / MIN_VW; vw = MIN_VW; }
    gx = m; gy = (H - 224 * sc) / 2; L.gw = aw;
    const pad = H * 0.025, sz = Math.min(m * 0.36, H * 0.13);
    const y0 = pad * 3 + sz, avail = H - pad - y0, h1 = avail * 0.46, h2 = avail - h1;
    if (layoutMode === "split") {
      btn(B, "left",  0,     y0,      m, h1, "");
      btn(B, "jump",  0,     y0 + h1, m, h2, "SKOK");
      btn(B, "right", W - m, y0,      m, h1, "");
      btn(B, "run",   W - m, y0 + h1, m, h2, "BIEG|STRZAŁ");
    } else {
      btn(B, "left",  0,     y0, m / 2, avail, "");
      btn(B, "right", m / 2, y0, m / 2, avail, "");
      btn(B, "run",   W - m, y0,      m, h1, "BIEG|STRZAŁ");
      btn(B, "jump",  W - m, y0 + h1, m, h2, "SKOK");
    }
    btn(B, "pause",  m / 2 - sz - pad / 2, pad * 1.5, sz, sz, "", true);
    btn(B, "sound",  m / 2 + pad / 2,      pad * 1.5, sz, sz, "", true);
    btn(B, "layout", W - m / 2 - sz - pad / 2, pad * 1.5, sz, sz, "", true);
    if (fsOK()) btn(B, "fs", W - m / 2 + pad / 2, pad * 1.5, sz, sz, "", true);
  } else if (isTouch) {
    // pionowo: gra u góry, sterowanie pod spodem
    sc = W / MIN_VW; vw = MIN_VW; L.gw = W;
    const gh = 224 * sc, pad = W * 0.02, sz = W * 0.09;
    const y0 = gh + pad, avail = H - y0 - pad, r1 = avail * 0.6, r2 = avail - r1;
    btn(B, "left",  0,         y0,      W * 0.25, r1, "");
    btn(B, "right", W * 0.25,  y0,      W * 0.25, r1, "");
    btn(B, "jump",  W * 0.5,   y0,      W * 0.5,  r1, "SKOK");
    btn(B, "run",   0,         y0 + r1, W,        r2, "BIEG|STRZAŁ");
    btn(B, "pause", W - sz * 3.4, pad, sz, sz, "", true);
    btn(B, "sound", W - sz * 2.2, pad, sz, sz, "", true);
    if (fsOK()) btn(B, "fs", W - sz * 1.1, pad, sz, sz, "", true);
  } else {
    sc = H / 224; vw = W / sc;
    if (vw < MIN_VW) { sc = W / MIN_VW; vw = MIN_VW; }
    gy = (H - 224 * sc) / 2; L.gw = W;
    const sz = Math.max(28, H * 0.07), pad = sz * 0.3;
    btn(B, "pause", W - sz - pad, gy + pad, sz, sz, "", true);
    btn(B, "sound", W - 2 * sz - 2 * pad, gy + pad, sz, sz, "", true);
    if (fsOK()) btn(B, "fs", W - 3 * sz - 3 * pad, gy + pad, sz, sz, "", true);
  }
  L.gx = gx; L.gy = gy; L.sc = sc; L.gh = 224 * sc; L.buttons = B;
  game.viewW = vw;
}

function hitBtn(x, y) {
  const B = L.buttons;
  for (let i = B.length - 1; i >= 0; i--) {          // małe przyciski mają pierwszeństwo
    const b = B[i], m = b.small ? b.w * 0.15 : 0;
    if (x >= b.x - m && x <= b.x + b.w + m && y >= b.y - m && y <= b.y + b.h + m) return b;
  }
  return null;
}

const pointers = new Map();
const kb = { left: false, right: false, jump: false, run: false };
function syncInput() {
  let l = false, r = false, j = false, b = false;
  for (const pt of pointers.values()) {
    const h = hitBtn(pt.x, pt.y); if (!h) continue;
    switch (h.id) { case "left": l = true; break; case "right": r = true; break; case "jump": j = true; break; case "run": b = true; break; }
  }
  game.inLeft = l || kb.left; game.inRight = r || kb.right; game.inJump = j || kb.jump; game.inRun = b || kb.run;
}
function toggleFullscreen() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (cv.requestFullscreen) cv.requestFullscreen(); } catch (e) {}
}
function toPx(e) { return { x: (e.clientX - cssRect.left) * ratio, y: (e.clientY - cssRect.top) * ratio }; }
function onDown(e) {
  Sfx.unlock();
  if (e.pointerType === "touch") isTouch = true;
  const p = toPx(e);
  pointers.set(e.pointerId, p);
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  const st = game.state;
  if (st === ST.TITLE || st === ST.OVER || st === ST.WIN) {
    game.tap((p.x - L.gx) / L.sc);                       // lewy margines = Maja, prawy = Gucio
  } else {
    const h = hitBtn(p.x, p.y), id = h ? h.id : "";
    if (id === "pause") { if (st === ST.PLAY) game.paused = !game.paused; }
    else if (id === "sound") Sfx.enabled = !Sfx.enabled;
    else if (id === "fs") toggleFullscreen();
    else if (id === "layout") {
      layoutMode = layoutMode === "split" ? "classic" : "split";
      try { localStorage.setItem("maja-layout", layoutMode); } catch (er) {}
    } else if (game.paused) game.paused = false;
  }
  syncInput();
  e.preventDefault();
}
function onMove(e) { if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, toPx(e)); syncInput(); } }
function onUp(e) { pointers.delete(e.pointerId); syncInput(); }
cv.addEventListener("pointerdown", onDown);
cv.addEventListener("pointermove", onMove);
cv.addEventListener("pointerup", onUp);
cv.addEventListener("pointercancel", onUp);
cv.addEventListener("contextmenu", e => e.preventDefault());

const keyMap = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  Space: "jump", KeyZ: "jump", ArrowUp: "jump", KeyW: "jump",
  ShiftLeft: "run", ShiftRight: "run", KeyX: "run", KeyJ: "run"
};
window.addEventListener("keydown", e => {
  Sfx.unlock();
  const code = e.code;
  if (code === "KeyM") { Sfx.enabled = !Sfx.enabled; return; }
  if (code === "KeyF") { toggleFullscreen(); return; }
  const st = game.state;
  if (st === ST.TITLE) {
    if (code === "ArrowLeft" || code === "KeyA") game.hero = 0;
    else if (code === "ArrowRight" || code === "KeyD") game.hero = 1;
    else if (code === "Enter" || code === "Space" || code === "KeyZ") game.startGame();
    else return;
    e.preventDefault(); return;
  }
  if (st === ST.OVER || st === ST.WIN) { if (code === "Enter" || code === "Space") { game.state = ST.TITLE; e.preventDefault(); } return; }
  if (code === "KeyP" || code === "Escape") { if (st === ST.PLAY) game.paused = !game.paused; return; }
  const k = keyMap[code];
  if (k) { kb[k] = true; if (game.paused) game.paused = false; syncInput(); e.preventDefault(); }
});
window.addEventListener("keyup", e => { const k = keyMap[e.code]; if (k) { kb[k] = false; syncInput(); } });
window.addEventListener("blur", () => { for (const k in kb) kb[k] = false; syncInput(); if (game.state === ST.PLAY) game.paused = true; });
document.addEventListener("visibilitychange", () => { if (document.hidden && game.state === ST.PLAY) game.paused = true; });

/* --- główne rysowanie --- */
function render() {
  computeLayout();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PANEL; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.rect(L.gx, L.gy, L.gw, L.gh); ctx.clip();
  ctx.translate(L.gx, L.gy); ctx.scale(L.sc, L.sc);
  const g = game, vw = g.viewW;
  if (g.state === ST.TITLE) drawTitle();
  else if (g.state === ST.INTRO) drawIntro();
  else {
    drawWorld(); drawHud();
    if (g.state === ST.OVER) {
      fill(0, 0, vw, 224, 0xAA000000);
      txt("KONIEC GRY", vw / 2, 100, 26, 0xFFFF5252, "center");
      txt("Wynik: " + g.score + "   Rekord: " + g.best, vw / 2, 124, 12, WHITE, "center");
      txt("Dotknij ekranu lub naciśnij Enter, aby wrócić do menu", vw / 2, 150, 9, WHITE, "center");
    } else if (g.state === ST.WIN) drawWin();
    else if (g.paused) {
      fill(0, 0, vw, 224, 0x99000000);
      txt("PAUZA", vw / 2, 110, 24, WHITE, "center");
      txt("Dotknij ekranu lub naciśnij dowolny klawisz", vw / 2, 132, 9, WHITE, "center");
    }
  }
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawControls();
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawControls() {
  const st = game.state;
  if (!(st === ST.PLAY || st === ST.DYING || st === ST.CLEAR)) return;
  const pr = { left: game.inLeft, right: game.inRight, jump: game.inJump, run: game.inRun,
               pause: game.paused, sound: !Sfx.enabled, fs: !!document.fullscreenElement, layout: false };
  for (const b of L.buttons) { if (b.small) drawSmall(b, pr[b.id]); else drawBig(b, pr[b.id]); }
}

function drawBig(b, on) {
  const m = Math.min(b.w, b.h), pad = m * 0.05;
  const x = b.x + pad, y = b.y + pad, w = b.w - 2 * pad, h = b.h - 2 * pad;
  rr(x, y, w, h, m * 0.16);
  ctx.fillStyle = on ? "rgba(255,210,31,0.42)" : "rgba(255,210,31,0.12)"; ctx.fill();
  ctx.strokeStyle = on ? "rgba(255,226,102,0.95)" : "rgba(255,210,31,0.5)"; ctx.lineWidth = Math.max(2, H * 0.004); ctx.stroke();
  const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) * 0.2;
  ctx.fillStyle = on ? "rgba(255,255,255,0.95)" : "rgba(255,236,170,0.85)";
  if (b.id === "left" || b.id === "right") {
    const d = b.id === "left" ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(cx + d * r, cy); ctx.lineTo(cx - d * r * 0.7, cy - r * 0.95); ctx.lineTo(cx - d * r * 0.7, cy + r * 0.95); ctx.closePath(); ctx.fill();
  } else {
    const lines = b.label.split("|"), fs = Math.min(w, h) * (lines.length > 1 ? 0.17 : 0.22);
    if (b.id === "jump") { ctx.beginPath(); ctx.moveTo(cx, cy - r * 1.25); ctx.lineTo(cx - r * 0.9, cy - r * 0.2); ctx.lineTo(cx + r * 0.9, cy - r * 0.2); ctx.closePath(); ctx.fill(); }
    setFont(fs); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    const ty = b.id === "jump" ? cy + r * 0.95 : cy - (lines.length - 1) * fs * 0.45 + fs * 0.35;
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, ty + i * fs * 1.15);
  }
}

function drawSmall(b, on) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, r = b.w / 2;
  ctx.fillStyle = on ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.14)";
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = Math.max(1.5, r * 0.07); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.strokeStyle = "rgba(255,255,255,0.9)";
  switch (b.id) {
    case "pause": ctx.fillRect(cx - r * 0.35, cy - r * 0.4, r * 0.25, r * 0.8); ctx.fillRect(cx + r * 0.1, cy - r * 0.4, r * 0.25, r * 0.8); break;
    case "sound":
      ctx.fillRect(cx - r * 0.45, cy - r * 0.2, r * 0.3, r * 0.4);
      ctx.beginPath(); ctx.moveTo(cx - r * 0.15, cy - r * 0.2); ctx.lineTo(cx + r * 0.25, cy - r * 0.5); ctx.lineTo(cx + r * 0.25, cy + r * 0.5); ctx.lineTo(cx - r * 0.15, cy + r * 0.2); ctx.closePath(); ctx.fill();
      if (!Sfx.enabled) { ctx.strokeStyle = "#ff5252"; ctx.lineWidth = r * 0.14; ctx.beginPath(); ctx.moveTo(cx - r * 0.55, cy + r * 0.55); ctx.lineTo(cx + r * 0.55, cy - r * 0.55); ctx.stroke(); }
      break;
    case "layout": {   // dwie strzałki ⇄
      ctx.lineWidth = r * 0.12; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx - r * 0.5, cy - r * 0.2); ctx.lineTo(cx + r * 0.5, cy - r * 0.2); ctx.moveTo(cx + r * 0.25, cy - r * 0.45); ctx.lineTo(cx + r * 0.5, cy - r * 0.2); ctx.lineTo(cx + r * 0.25, cy + 0.05 * r);
      ctx.moveTo(cx + r * 0.5, cy + r * 0.25); ctx.lineTo(cx - r * 0.5, cy + r * 0.25); ctx.moveTo(cx - r * 0.25, cy); ctx.lineTo(cx - r * 0.5, cy + r * 0.25); ctx.lineTo(cx - r * 0.25, cy + r * 0.5);
      ctx.stroke(); break;
    }
    case "fs": {
      ctx.lineWidth = r * 0.11; ctx.lineCap = "square";
      const a = r * 0.45, k = r * 0.2;
      ctx.beginPath();
      ctx.moveTo(cx - a, cy - a + k); ctx.lineTo(cx - a, cy - a); ctx.lineTo(cx - a + k, cy - a);
      ctx.moveTo(cx + a - k, cy - a); ctx.lineTo(cx + a, cy - a); ctx.lineTo(cx + a, cy - a + k);
      ctx.moveTo(cx + a, cy + a - k); ctx.lineTo(cx + a, cy + a); ctx.lineTo(cx + a - k, cy + a);
      ctx.moveTo(cx - a + k, cy + a); ctx.lineTo(cx - a, cy + a); ctx.lineTo(cx - a, cy + a - k);
      ctx.stroke(); break;
    }
  }
}

/* --- ekrany --- */
function drawTitle() {
  const vw = game.viewW, f = game.frame;
  drawBackground(0, f * 0.6);
  fill(0, 196, vw, 28, pals[0].dirt); fill(0, 196, vw, 5, pals[0].top);
  txt("PSZCZÓŁKA MAJA", vw / 2, 38, 26, 0xFFFFD21F, "center");
  txt("Łąkowa Przygoda", vw / 2, 58, 14, WHITE, "center");
  for (let i = 0; i < 2; i++) {
    const cx = vw * (i === 0 ? 0.27 : 0.73);
    rrect(cx - 66, 72, 132, 106, 8, i === game.hero ? 0x88000000 : 0x55000000);
    if (i === game.hero) { ctx.strokeStyle = "rgba(255,226,102,0.9)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - 66, 72, 132, 106, 8) : ctx.rect(cx - 66, 72, 132, 106); ctx.stroke(); }
    ctx.save(); ctx.translate(cx, 128 + Math.sin(f * 0.1 + i * 2) * 2); ctx.scale(3.2, 3.2);
    drawHero(0, 0, 12, 14, 1, f * 0.15, i, true);
    ctx.restore();
    txt(i === 0 ? "MAJA" : "GUCIO", cx, 150, 13, WHITE, "center");
    txt(i === 0 ? "pszczółka – zwinna" : "konik polny – skacze wyżej", cx, 163, 7.5, 0xFFFFE082, "center");
    txt(i === 0 ? "" : "ale się ślizga", cx, 172, 7.5, 0xFFFFE082, "center");
  }
  if (Math.floor(f / 30) % 2 === 0) txt(isTouch ? "Dotknij bohatera, aby zacząć" : "Wybierz ← → i naciśnij Enter (lub kliknij bohatera)", vw / 2, 190, 10, WHITE, "center");
  if (game.best > 0) txt("Rekord: " + game.best, vw - 6, 12, 8, 0xFFFFE082, "right");
  txt("Gra fanowska • postacie z serialu „Pszczółka Maja”", vw / 2, 218, 6.5, 0xCCFFFFFF, "center", false);
}

function drawIntro() {
  const vw = game.viewW;

  txt("ŚWIAT " + game.lv.code, vw / 2, 80, 20, WHITE, "center");

}

function drawWin() {

function drawDrop(cx, cy, k) {
  oval(cx - 3.5 * k, cy - 4.5, 7 * k, 9, 0xFFFFB300);
  oval(cx - 1.8 * k, cy - 3, 2 * k, 4, 0xFFFFE082);
}

function drawHud() {
  const g = game, vw = g.viewW;
  txt(g.hero === 0 ? "MAJA" : "GUCIO", 8, 11, 8, WHITE);
  txt(String(g.score).padStart(6, "0"), 8, 20, 8, WHITE);
  const cx = vw * 0.23;
  drawDrop(cx, 14, 1);
  txt("×" + String(g.coins).padStart(2, "0"), cx + 6, 20, 8, WHITE);
  txt("ŚWIAT", vw * 0.38, 11, 8, WHITE); txt(g.lv.code, vw * 0.38, 20, 8, WHITE);
  txt("CZAS", vw * 0.50, 11, 8, WHITE); txt(String(Math.ceil(Math.max(g.time, 0))), vw * 0.50, 20, 8, WHITE);
  ctx.save(); ctx.translate(vw * 0.62, 20); ctx.scale(0.6, 0.6);
  drawHero(0, 0, 12, 14, 1, 0, g.hero, false);
  ctx.restore();
  txt("×" + g.lives, vw * 0.62 + 8, 20, 8, WHITE);

/* --- tło --- */
function layerHills(cam, par, sp, hBase, hVar, c, vw) {
  const off = cam * par, i0 = Math.floor(off / sp);
  for (let i = i0; i <= i0 + Math.floor(vw / sp) + 2; i++) {
    const h = hBase + (hash(i) % Math.floor(hVar));
    oval(i * sp - off - 10, 192 - h, sp * 1.15, h * 2, c);
  }
}
function clouds(cam, c, vw) {
  const sp = 140, off = cam * 0.1, i0 = Math.floor(off / sp);
  for (let i = i0; i <= i0 + Math.floor(vw / sp) + 2; i++) {
    const h = hash(i + 5), x = i * sp - off + (h % 40), y = 18 + (Math.floor(h / 3) % 50);
    oval(x, y, 34, 13, c); oval(x + 9, y - 7, 22, 16, c); oval(x + 20, y - 2, 26, 12, c);
  }
}
let hexPat = null;
function makeHexPattern() {
  const pc = document.createElement("canvas"); pc.width = 35; pc.height = 15;
  const px = pc.getContext("2d");
  px.strokeStyle = C(0x33FFC107); px.lineWidth = 1.2;
  for (const c of [[0,0],[0,15],[35,0],[35,15],[17.5,-7.5],[17.5,7.5],[17.5,22.5]]) {
    px.save(); px.translate(c[0], c[1]); px.stroke(hexPath); px.restore();
  }
  return ctx.createPattern(pc, "repeat");
}
function drawBackground(theme, cam) {
  const vw = game.viewW;
  ctx.fillStyle = sky[theme]; ctx.fillRect(0, 0, vw + 1, 224);
  if (theme === 0) {
    circ(vw * 0.82, 40, 24, 0x33FFF59D); circ(vw * 0.82, 40, 15, 0xFFFFF176);
    layerHills(cam, 0.2, 170, 50, 25, 0xFF9AD98F, vw);
    layerHills(cam, 0.4, 120, 32, 20, 0xFF6DBB63, vw);
    clouds(cam, 0xCCFFFFFF, vw);
  } else if (theme === 1) {
    const sp = 40, off = cam * 0.5, i0 = Math.floor(off / sp);
    for (let i = i0; i <= i0 + Math.floor(vw / sp) + 2; i++) {
      const h = hash(i), x = i * sp - off;
      poly([x, 192, x + 18, 192 - 20 - (h % 40), x + 36, 192], 0xFF24150E);
      if (h % 3 === 0) {
        const fx = x + (h % 30), fy = 70 + (Math.floor(h / 7) % 100);
        circ(fx, fy, 4, 0x2280DEEA); circ(fx, fy, 1.8, 0xAA80DEEA);
      }
    }
  } else if (theme === 2) {
    circ(vw * 0.7, 150, 34, 0x44FFD180); circ(vw * 0.7, 150, 24, 0xFFFFD180);
    layerHills(cam, 0.2, 200, 60, 30, 0xFF7E57C2, vw);
    clouds(cam, 0x99FFCCBC, vw);
    const sp = 110, off = cam * 0.3, i0 = Math.floor(off / sp);
    for (let i = i0; i <= i0 + Math.floor(vw / sp) + 2; i++) {
      const h = hash(i), x = i * sp - off + (h % 30);
      fill(x, 20, 14, 204, 0x884A2C1A); oval(x - 22, 4, 58, 34, 0x882E6B34);
    }
    const sp2 = 70, off2 = cam * 0.55, j0 = Math.floor(off2 / sp2);
    for (let i = j0; i <= j0 + Math.floor(vw / sp2) + 2; i++) {
      const h = hash(i + 77), x = i * sp2 - off2 + (h % 20);
      fill(x, 0, 10, 224, 0xAA3A2212);
    }
  } else {
    if (!hexPat) hexPat = makeHexPattern();
    const off = cam * 0.4, o = off % 35;
    ctx.save(); ctx.translate(-o, 0); ctx.fillStyle = hexPat; ctx.fillRect(o, 0, vw + 36, 224); ctx.restore();
    oval(-20, 180, vw + 40, 80, 0x33FF8F00);
  }
}

/* --- świat --- */
function drawWorld() {
  const g = game, lv = g.lv, pal = pals[lv.theme];
  drawBackground(lv.theme, g.camX);
  ctx.save();
  const cam = Math.floor(g.camX);
  ctx.translate(-cam, 0);
  const x0 = Math.max(0, Math.floor(cam / TS) - 1), x1 = Math.min(lv.w - 1, Math.floor((cam + g.viewW) / TS) + 1);
  drawGoal();
  for (let ty = 0; ty < LH; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = lv.tiles[ty][tx];
    if (t === T.AIR) continue;
    let dy = 0;
    if (g.bumps.length) for (const b of g.bumps) if (b.tx === tx && b.ty === ty) dy = -Math.sin(b.t / 8 * PI) * 4;
    drawTile(t, tx, ty, tx * TS, ty * TS + dy, pal, lv);
  }
  for (const e of g.ents) {
    if (e.x + e.w < cam - 40 || e.x > cam + g.viewW + 40) continue;
    drawEnt(e);
  }
  const p = g.p;
  if (!g.playerHidden && !(g.invuln > 0 && g.frame % 4 < 2)) {
    if (g.starT > 0) {
      ctx.fillStyle = "hsla(" + (g.frame * 12 % 360) + ",90%,65%,0.43)";
      ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.h * 0.75, 0, PI * 2); ctx.fill();
    }
    drawHero(p.x + p.w / 2, p.y + p.h, p.w, p.h, g.facing, g.anim, g.hero, !p.onGround);
  }
  for (const pt of g.parts) {
    if (pt.kind === 0) fill(pt.x, pt.y, 5, 5, pt.color); else drawDrop(pt.x + 4, pt.y, Math.abs(Math.cos(pt.life * 0.5)));
  }
  ctx.restore();
}

function drawGoal() {
  const g = game, x = g.lv.goalX * TS;
  fill(x + 7, 3 * TS, 2, 9 * TS, 0xFF2E7D32);
  for (let i = 0; i < 6; i++) { const a = i * PI / 3; circ(x + 8 + Math.cos(a) * 4.5, 3 * TS - 2 + Math.sin(a) * 4.5, 3.2, 0xFFFF80AB); }
  circ(x + 8, 3 * TS - 2, 3.2, 0xFFFFEB3B);
  const hx = (g.lv.goalX + 5) * TS, by = 12 * TS;
  oval(hx, by - 22, 44, 22, 0xFFC68A1A); oval(hx + 4, by - 38, 36, 22, 0xFFD9A027);
  oval(hx + 9, by - 50, 26, 18, 0xFFE8B83A); oval(hx + 15, by - 56, 14, 10, 0xFFF2C94C);
  oval(hx + 16, by - 12, 12, 12, 0xFF3E2200);
  for (let i = 0; i < 3; i++) fill(hx + 4 + i * 2, by - 28 + i * 2, 36 - i * 4, 1.5, 0xFF9A6410);
}

function drawTile(t, tx, ty, x, y, pal, lv) {
  const h = hash(tx * 31 + ty * 7);
  switch (t) {
    case T.GROUND: {
      fill(x, y, TS, TS, pal.dirt);
      const above = lv.get(tx, ty - 1);
      if (!lv.isSolid(above) || above === T.PIPE_L) {
        fill(x, y, TS, 4, pal.top);
        for (let i = 0; i < 4; i++) fill(x + i * 4 + (h % 2), y + 4, 2, 2, pal.top);
        if (lv.theme !== 1 && lv.theme !== 3 && h % 3 === 0) {
          const fx = x + 3 + (Math.floor(h / 3) % 9);
          fill(fx, y - 5, 1, 5, 0xFF2E7D32);
          const colr = [0xFFFF80AB, 0xFFFFF176, 0xFFFFFFFF, 0xFFB388FF][Math.floor(h / 11) % 4];
          circ(fx + 0.5, y - 6, 2.4, colr); circ(fx + 0.5, y - 6, 0.9, 0xFFFFB300);
        }
      } else {
        fill(x + 3 + (h % 6), y + 4 + (Math.floor(h / 5) % 6), 3, 2, pal.dirtDark);
        fill(x + 9, y + 10, 2, 2, pal.dirtDark);
      }
      if (lv.theme === 1 && lv.get(tx, ty + 1) === T.AIR) {
        fill(x, y + 13, TS, 3, pal.top);
        if (h % 2 === 0) fill(x + 4 + (h % 6), y + 16, 2, 5 + (h % 5), pal.top);
      }
      break;
    }
    case T.BRICK:
      fill(x, y, TS, TS, pal.brick);
      fill(x, y + 7.5, TS, 1, pal.brickLine); fill(x, y, TS, 1, pal.brickLine); fill(x, y + 15, TS, 1, pal.brickLine);
      fill(x + 7.5, y, 1, 8, pal.brickLine); fill(x + 3.5, y + 8, 1, 8, pal.brickLine); fill(x + 11.5, y + 8, 1, 8, pal.brickLine);
      break;
    case T.QBLOCK: {
      const glow = (Math.floor(game.frame / 14) % 3 === 0) ? 0xFFFFE082 : 0xFFFFC107;
      fill(x, y, TS, TS, 0xFF9A6700); fill(x + 1, y + 1, 14, 14, glow);
      fill(x + 2, y + 2, 1.5, 1.5, 0xFF9A6700); fill(x + 12.5, y + 2, 1.5, 1.5, 0xFF9A6700);
      fill(x + 2, y + 12.5, 1.5, 1.5, 0xFF9A6700); fill(x + 12.5, y + 12.5, 1.5, 1.5, 0xFF9A6700);
      txt("?", x + 8, y + 12.5, 12, WHITE, "center");
      break;
    }
    case T.USED:
      fill(x, y, TS, TS, 0xFF5D4037); fill(x + 1, y + 1, 14, 14, 0xFF8D6E63);
      fill(x + 2, y + 2, 1.5, 1.5, 0xFF5D4037); fill(x + 12.5, y + 2, 1.5, 1.5, 0xFF5D4037);
      break;
    case T.HARD:
      fill(x, y, TS, TS, pal.hard);
      fill(x, y, TS, 2, 0x55FFFFFF); fill(x, y, 2, TS, 0x55FFFFFF);
      fill(x, y + 14, TS, 2, 0x55000000); fill(x + 14, y, 2, TS, 0x55000000);
      break;
    case T.PIPE_L: case T.PIPE_R: {
      const a = lv.get(tx, ty - 1), top = a !== T.PIPE_L && a !== T.PIPE_R, left = t === T.PIPE_L;
      fill(x, y, TS, TS, 0xFF3FA535);
      fill(left ? x + 3 : x + 10, y, 2.5, TS, 0xFF7BD86F);
      fill(left ? x : x + 14, y, 2, TS, 0xFF2A7A24);
      if (top) {
        const cx = left ? x - 2 : x;
        fill(cx, y, 18, 8, 0xFF55C14A); fill(cx, y, 18, 1.5, 0xFF2A7A24); fill(cx, y + 6.5, 18, 1.5, 0xFF2A7A24);
        fill(left ? cx : cx + 16, y, 2, 8, 0xFF2A7A24);
        fill(left ? cx + 3 : cx + 5, y + 1.5, 2.5, 5, 0xFF9BEA90);
      }
      break;
    }
    case T.COIN: {
      const k = Math.abs(Math.cos(game.frame * 0.08 + tx * 0.7));
      drawDrop(x + 8, y + 8, Math.max(0.25, k));
      break;
    }
    case T.LEAF:
      fill(x, y, TS, 8, pal.leaf); fill(x, y + 8, TS, 3, pal.leafDark); fill(x, y, TS, 1.5, 0x55FFFFFF);
      fill(x + 7.5, y + 1, 1, 7, pal.leafDark);
      poly([x, y + 11, x + 4, y + 15, x + 8, y + 11, x + 12, y + 15, x + 16, y + 11], pal.leafDark);
      break;
    case T.GATE:
      fill(x, y, TS, TS, 0xFF6B3A00); fill(x + 1, y, 6, TS, 0xFFFFB300); fill(x + 9, y, 6, TS, 0xFFFFB300);
      fill(x + 2, y, 1.5, TS, 0x66FFFFFF); fill(x + 10, y, 1.5, TS, 0x66FFFFFF);
      break;
  }
}

/* --- sprite'y --- */
function drawEnt(e) {
  const cx = e.x + e.w / 2, by = e.y + e.h;
  ctx.save();
  if (e.knocked) { ctx.translate(cx, e.y + e.h / 2); ctx.scale(1, -1); ctx.translate(-cx, -(e.y + e.h / 2)); }
  switch (e.type) {
    case K.BEETLE: drawBeetle(cx, by, e); break;
    case K.SNAIL: drawSnail(cx, by, e); break;
    case K.HORNET: drawHornet(cx, by, e); break;
    case K.SPIDER: drawSpider(cx, by, e, 1, 1); break;
    case K.BOSS: if (!(e.timer > 0 && Math.floor(game.frame / 3) % 2 === 0)) drawSpider(cx, by, e, 2, 1.7); break;
    case K.ALEK: drawAlek(cx, by, e); break;
    case K.HONEY:
      fill(cx - 5, by - 11, 10, 11, 0xFFFFA000); fill(cx - 5, by - 14, 10, 3.5, 0xFF6D4C41);
      fill(cx - 3, by - 8, 6, 4, 0xFFFFF3E0); fill(cx - 4, by - 10, 1.5, 8, 0x66FFFFFF);
      break;
    case K.FLOWER:
      fill(cx - 0.8, by - 8, 1.6, 8, 0xFF2E7D32); oval(cx + 0.5, by - 5, 5, 2.5, 0xFF43A047);
      for (let i = 0; i < 5; i++) { const a = i * PI * 2 / 5 + game.frame * 0.03; circ(cx + Math.cos(a) * 4, by - 10 + Math.sin(a) * 4, 3, 0xFFFF5252); }
      circ(cx, by - 10, 2.6, 0xFFFFEB3B);
      break;
    case K.ONEUP:
      circ(cx, by - 6, 6.2, 0xFFE53935); circ(cx + 4, by - 7, 3.6, 0xFF212121);
      line(cx - 1, by - 12, cx - 1, by - 0.5, 0xFF212121, 1);
      circ(cx - 3, by - 8, 1.2, 0xFF212121); circ(cx - 3.5, by - 3.5, 1.2, 0xFF212121); circ(cx + 2.5, by - 3, 1.2, 0xFF212121);
      break;
    case K.STAR:
      circ(cx, by - 7, 8, "hsla(" + (game.frame * 9 % 360) + ",100%,75%,0.35)");
      oval(cx - 5, by - 10, 10, 6, 0xFFFFEE58); oval(cx - 3, by - 13, 6, 5, 0x99E1F5FE); circ(cx + 3, by - 7, 1.2, 0xFF212121);
      break;
    case K.SHOT:
      circ(cx, e.y + e.h / 2, 3.6, 0xFFFF8F00); circ(cx, e.y + e.h / 2, 2.6, 0xFFFFD54F);
      break;
  }
  ctx.restore();
}

function drawBeetle(cx, by, e) {
  ctx.save(); ctx.translate(cx, by);
  if (e.state === -1) { oval(-7, -5, 14, 5, 0xFF7A4A24); ctx.restore(); return; }
  const lg = (Math.floor(game.frame / 6) % 2 === 0) ? 1 : -1;
  fill(-6, -2 + lg * 0.5, 3, 2, 0xFF3E2410); fill(3, -2 - lg * 0.5, 3, 2, 0xFF3E2410);
  oval(-7, -11, 14, 10, 0xFF7A4A24); oval(-5, -11, 10, 5, 0xFF9A6234);
  line(0, -11, 0, -4, 0xFF4A2A10, 0.8);
  circ(-2.6, -6, 2.3, WHITE); circ(2.6, -6, 2.3, WHITE);
  circ(-2.1, -5.6, 1.1, BLACK); circ(3.1, -5.6, 1.1, BLACK);
  line(-5.5, -9.8, -1.2, -7.8, BLACK, 1.2); line(5.5, -9.8, 1.2, -7.8, BLACK, 1.2);
  ctx.restore();
}

function drawSnail(cx, by, e) {
  ctx.save(); ctx.translate(cx, by); ctx.scale(e.dir, 1);
  if (e.state === 0) {
    oval(-8, -6, 16, 6, 0xFFE8D3A0); circ(6, -8, 3.2, 0xFFE8D3A0);
    line(5, -10, 5, -14, 0xFFE8D3A0, 1); line(7.5, -10, 9, -13.5, 0xFFE8D3A0, 1);
    circ(5, -14, 1.2, BLACK); circ(9, -13.5, 1.2, BLACK);
    circ(-1, -8, 6.5, 0xFFB5651D); ring(-1, -8, 4, 0xFF7A3E0D, 1); ring(-1, -8, 1.8, 0xFF7A3E0D, 1);
  } else {
    ctx.translate(0, -6);
    if (e.state === 2) ctx.rotate(game.frame * 35 * PI / 180);
    circ(0, 0, 6.5, 0xFFB5651D); ring(0, 0, 4, 0xFF7A3E0D, 1); ring(0, 0, 1.8, 0xFF7A3E0D, 1);
    oval(3, -2, 4, 4, 0xFF3E2200);
  }
  ctx.restore();
}

function drawHornet(cx, by, e) {
  ctx.save(); ctx.translate(cx, by); ctx.scale(-e.dir, 1);
  const fl = Math.sin(game.frame * 0.9) * 22;
  rotAround(-25 + fl, -1, -9, () => oval(-8, -17, 8, 11, 0xAAE6F6FF));
  rotAround(-5 - fl, 1, -9, () => oval(-2, -16, 8, 10, 0x88E6F6FF));
  ctx.save();
  ctx.beginPath(); ctx.ellipse(-1, -5.5, 6, 4.5, 0, 0, PI * 2); ctx.clip();
  ctx.fillStyle = C(0xFFFFC107); ctx.fillRect(-8, -11, 14, 11);
  fill(-4, -10, 2.2, 10, 0xFF212121); fill(0, -10, 2.2, 10, 0xFF212121);
  ctx.restore();
  poly([5, -7, 9, -5, 5, -3], 0xFF212121);
  circ(-6, -6.5, 3.6, 0xFFE65100);
  circ(-7.2, -7.5, 1.5, 0xFFFF1744); circ(-7.5, -7.5, 0.6, BLACK);
  line(-9, -10, -5.5, -8.8, BLACK, 1);
  ctx.restore();
}

function drawSpider(cx, by, e, sx, sy) {
  if (e.type === K.SPIDER && by - e.baseY > 0) line(cx, e.baseY, cx, by - 8, 0xCCFFFFFF, 0.8);
  ctx.save(); ctx.translate(cx, by); ctx.scale(sx, sy);
  const w = Math.sin(game.frame * 0.25) * 1.5;
  for (let i = 0; i < 4; i++) {
    const yy = -3 - i * 1.6, s = i % 2 === 0 ? 1 : -1;
    line(-3, yy, -8, yy + 2 + w * s, 0xFF1A0E26, 1); line(3, yy, 8, yy + 2 - w * s, 0xFF1A0E26, 1);
  }
  circ(0, -6, 6, 0xFF4B2A63); circ(0, -4, 3, 0xFF7B3F98);
  circ(-2.3, -7, 2, WHITE); circ(2.3, -7, 2, WHITE);
  circ(-2.3, -6.8, 1, 0xFFD50000); circ(2.3, -6.8, 1, 0xFFD50000);
  line(-4.5, -10, -1, -8.5, BLACK, 1); line(4.5, -10, 1, -8.5, BLACK, 1);
  if (e.type === K.BOSS) poly([-4, -11, -4, -15, -2, -12.5, 0, -15.5, 2, -12.5, 4, -15, 4, -11], 0xFFFFD600);
  else { circ(3.5, -11, 1.8, 0xFFFF80AB); circ(6, -10, 1.8, 0xFFFF80AB); }
  ctx.restore();
}

function drawAlek(cx, by, e) {
  ctx.save(); ctx.translate(cx, by);
  oval(-7, -15, 14, 15, 0xFFF2B33D);
  fill(-6, -9, 12, 1.8, 0xFF8D5A00); fill(-6, -5, 12, 1.8, 0xFF8D5A00);
  circ(0, -14, 4.5, 0xFFFFD98A);
  line(-3.5, -14.5, -1, -14.5, BLACK, 1); line(1, -14.5, 3.5, -14.5, BLACK, 1);
  line(-1.5, -11.5, 1.5, -11.5, 0xFF8D3A00, 0.8);
  oval(-10, -16, 6, 9, 0x99E6F6FF);
  ctx.restore();
  const dx = Math.abs(game.p.x + game.p.w / 2 - cx);
  const msgs = ["Zzz... Skacz po wrogach!", "Tekla czyha na korzeniach!", "Ale wysoko... ja zostaję tu.", "Pokonaj Teklę, wróć do ula!"];
  if (dx < 70) {
    const s = msgs[Math.min(game.levelIdx, 3)], tw = measure(s, 6.5);
    rrect(cx - tw / 2 - 4, by - 38, tw + 8, 12, 4, 0xEEFFFFFF);
    txt(s, cx, by - 29.5, 6.5, BLACK, "center", false);
  } else txt((Math.floor(game.frame / 40) % 2 === 0) ? "z" : "Z", cx + 8, by - 20, 7, WHITE, "left", false);
}

function drawHero(cx, by, w, h, face, anim, hero, air) {
  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(face * (h > 20 ? 1.5 : 1), h / 14);
  const flap = Math.sin(anim * 1.8) * (air ? 28 : 12);
  const leg = air ? 1.5 : Math.sin(anim * 1.6) * 1.6;
  if (hero === 0) {
    rotAround(-30 + flap, -2, -9, () => oval(-9, -18, 8, 11, 0xAAE6F6FF));
    rotAround(-10 - flap, 0, -9, () => oval(-5, -17, 7, 10, 0x88E6F6FF));
    line(-2, -2, -2 + leg, 0, BLACK, 1.1); line(2, -2, 2 - leg, 0, BLACK, 1.1);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(-0.25, -5.25, 5.25, 3.75, 0, 0, PI * 2); ctx.clip();
    ctx.fillStyle = C(0xFFFFD21F); ctx.fillRect(-6, -10, 12, 10);
    fill(-3, -9, 1.8, 8, 0xFF222222); fill(0.5, -9, 1.8, 8, 0xFF222222);
    ctx.restore();
    poly([-5, -6, -8, -4.5, -5, -3], 0xFF222222);
    circ(2, -9.5, 4.8, 0xFFFFE066);
    oval(-2.6, -15, 8, 5, 0xFFE0A800);
    line(0.5, -14.5, -1.5, -18, BLACK, 0.8); line(3.5, -14.8, 5.5, -18, BLACK, 0.8);
    circ(-1.5, -18.2, 1, BLACK); circ(5.8, -18.2, 1, BLACK);
    circ(3.8, -10, 2, WHITE); circ(4.3, -10, 1.2, 0xFF2B6CB0); circ(4.5, -10, 0.6, BLACK);
    circ(1.3, -7.8, 0.9, 0x88FF80AB);
    line(3, -7.4, 5, -7.6, 0xFFC62828, 0.8);
  } else {
    rotAround(-30 + flap, -2, -8, () => oval(-9, -17, 8, 10, 0xAAC8E6C9));
    line(-3, -4, -6.5, -8.5, 0xFF2E7D32, 1.8); line(-6.5, -8.5, -7.5 - leg * 0.3, -0.5, 0xFF2E7D32, 1.6);
    line(2, -2, 2 + leg, 0, 0xFF2E7D32, 1.2);
    oval(-5.5, -8.5, 10.5, 7, 0xFF5DBB35); oval(-3.5, -5, 7, 3, 0xFFA6E07A);
    circ(3.2, -9.3, 4.1, 0xFF6CCB3F);
    circ(4.4, -10.6, 2.4, WHITE); circ(5, -10.5, 1.2, BLACK);
    line(3, -7.5, 5.6, -7.8, 0xFF1B5E20, 0.8);
    line(2.5, -12.8, 0.5, -18, 0xFF2E7D32, 0.9); line(4.5, -13, 7.5, -18, 0xFF2E7D32, 0.9);
    circ(0.5, -18, 0.9, 0xFF1B5E20); circ(7.5, -18, 0.9, 0xFF1B5E20);
  }
  ctx.restore();
}

/* --- pętla --- */
let last = performance.now(), acc = 0, ftSum = 0, ftN = 0;
const STEP = 1000 / 60;
function frame(now) {
  const dt = now - last; last = now;
  acc += Math.min(100, dt);
  while (acc >= STEP) { game.update(); acc -= STEP; }
  render();
  // jeśli klatki trwają za długo, zmniejsz rozdzielczość bufora (mniej lagów na słabszych telefonach)
  if (!document.hidden && game.state === ST.PLAY && !game.paused) {
    ftSum += Math.min(dt, 200); ftN++;
    if (ftN >= 90) {
      if (ftSum / ftN > 26 && qAdapt > 0.55) { qAdapt *= 0.8; resize(); }
      ftSum = 0; ftN = 0;
    }
  }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) {
  document.fonts.load("600 12px Fredoka", "ŁąęóśżźćńŚŻŹĆŃ×").catch(() => {});
}

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maja: Łąkowa Przygoda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #cfeaff;
    --ink: #1d2a1a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14110d; --ink: #f4ead2; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14110d; --ink: #f4ead2; color-scheme: dark; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
         font-family: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="Gra: Maja, Łąkowa Przygoda"></canvas>
<noscript><div id="noscript">Do gry potrzebny jest włączony JavaScript.</div></noscript>
<script>
"use strict";
/* =====================================================================
   Maja: Łąkowa Przygoda – port z wersji na Androida (Kotlin) na HTML5 canvas
   ===================================================================== */
const TS = 16, LH = 14, PI = Math.PI;
const T = { AIR:0, GROUND:1, BRICK:2, QBLOCK:3, USED:4, HARD:5, PIPE_L:6, PIPE_R:7, COIN:8, LEAF:9, GATE:10 };
const K = { BEETLE:1, SNAIL:2, HORNET:3, SPIDER:4, BOSS:5, ALEK:6, HONEY:10, FLOWER:11, ONEUP:12, STAR:13, SHOT:20 };
const ST = { TITLE:0, INTRO:1, PLAY:2, DYING:3, CLEAR:4, OVER:5, WIN:6 };
const FONT = '"Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';

/* ------------------------------------------------------------ kolory */
const colCache = new Map();
function C(v) {                       // 0xAARRGGBB -> css
  let s = colCache.get(v);
  if (!s) {
    const a = ((v >>> 24) & 255) / 255;
    s = "rgba(" + ((v >> 16) & 255) + "," + ((v >> 8) & 255) + "," + (v & 255) + "," + (a === 1 ? 1 : a.toFixed(3)) + ")";
    colCache.set(v, s);
  }
  return s;
}
const col = (c) => (typeof c === "number" ? C(c) : c);
const WHITE = 0xFFFFFFFF, BLACK = 0xFF000000;

/* ------------------------------------------------------------ dźwięk */
const Sfx = {
  ctx: null, mode: 0,                       // 0 = muzyka + efekty, 1 = tylko efekty, 2 = cisza
  get enabled() { return this.mode !== 2; },
  get musicOn() { return this.mode === 0; },
  cycle() { this.mode = (this.mode + 1) % 3; try { localStorage.setItem("maja-snd", String(this.mode)); } catch (e) {} },
  defs: {
    jump: [[280,35],[440,35],[620,50]], stomp: [[220,30],[120,60]], coin: [[900,40],[1350,100]],
    bump: [[140,60]], "break": [[300,25],[0,10],[200,30],[120,45]], item: [[400,40],[500,40],[600,40],[800,80]],
    grow: [[300,40],[400,40],[500,40],[600,40],[750,60]], shrink: [[700,40],[550,40],[400,40],[300,60]],
    die: [[500,90],[420,90],[340,90],[260,120],[160,220]], kick: [[700,30],[480,60]], shoot: [[800,25],[520,45]],
    clear: [[520,90],[660,90],[780,90],[1040,90],[780,90],[1040,250]], boss: [[160,100],[110,160]],
    oneup: [[660,70],[880,70],[1100,70],[1320,120]], tick: [[1200,12]],
    pause: [[500,40],[380,60]]
  },
  unlock() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) {}
  },
  play(name) {
    if (!this.enabled || !this.ctx || this.ctx.state !== "running") return;
    const d = this.defs[name]; if (!d) return;
    try {
      const ctx = this.ctx, osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = "square";
      let t = ctx.currentTime;
      g.gain.setValueAtTime(0.05, t);
      for (const n of d) { osc.frequency.setValueAtTime(Math.max(n[0], 1), t); if (n[0] <= 0) { /* pauza */ } t += n[1] / 1000; }
      g.gain.setValueAtTime(0.05, t - 0.02);
      g.gain.linearRampToValueAtTime(0.0001, t);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(t + 0.02);
    } catch (e) {}
  }
};


try { const m = parseInt(localStorage.getItem("maja-snd") || "0", 10); if (m >= 0 && m <= 2) Sfx.mode = m; } catch (e) {}

/* ------------------------------------------------------------- muzyka */
// Oryginalne, krótkie motywy (nie są kopiami piosenek z serialu) grane syntezatorem WebAudio.
const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midiOf(tok) {
  const m = /^([A-G])([#b]?)(\d)$/.exec(tok); if (!m) return null;
  return 12 * (parseInt(m[3], 10) + 1) + NOTE_BASE[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
}
function parseLine(str) {                       // "C5 . E5 _" -> tablica kroków (ósemek)
  const toks = str.trim().split(/\s+/), out = []; let last = null;
  for (const t of toks) {
    if (t === ".") { out.push(null); last = null; }
    else if (t === "_") { out.push(null); if (last) last.len++; }
    else { const o = { m: midiOf(t), len: 1 }; out.push(o); last = o; }
  }
  return out;
}
function mkTrack(o) {
  const t = { bpm: o.bpm, loop: o.loop !== false, mel: parseLine(o.mel), bass: parseLine(o.bass), perc: o.perc ? o.perc.trim().split(/\s+/) : null,
              mi: o.mi || { type: "triangle", vol: 0.075, pluck: 0.5 }, bi: o.bi || { type: "triangle", vol: 0.1, pluck: 0 } };
  t.len = Math.max(t.mel.length, t.bass.length);
  return t;
}
const bars = (...b) => b.join(" ");
const TRACKS = {
  title: mkTrack({ bpm: 92, mi: { type: "triangle", vol: 0.08, pluck: 0.3 },
    mel: bars("G4 _ B4 _ D5 _ B4 _", "C5 _ E5 _ G5 _ E5 _", "B4 _ D5 _ G5 _ D5 B4", "A4 _ _ _ D5 _ _ .",
              "G4 _ B4 _ D5 _ B4 _", "E5 _ G5 _ B5 _ G5 _", "D5 _ C5 _ B4 _ A4 _", "G4 _ _ _ _ _ _ ."),
    bass: bars("G2 . D3 . G2 . D3 .", "C3 . G3 . C3 . G3 .", "G2 . D3 . G2 . D3 .", "D3 . A3 . D3 . A3 .",
               "G2 . D3 . G2 . D3 .", "C3 . G3 . C3 . G3 .", "D3 . A3 . D3 . A3 .", "G2 . D3 . G2 . . .") }),
  l0: mkTrack({ bpm: 132, mi: { type: "square", vol: 0.05, pluck: 0.55, chorus: true },
    mel: bars("E5 . G5 E5 C5 . D5 E5", "G5 _ . E5 D5 . C5 .", "A4 . C5 A4 F4 . A4 C5", "D5 _ E5 D5 B4 . G4 .",
              "E5 . G5 E5 C5 . E5 G5", "C6 _ . G5 E5 . G5 .", "F5 . E5 D5 C5 . D5 E5", "C5 _ _ _ G4 . C5 ."),
    bass: bars("C3 . G3 . C3 . G3 .", "C3 . G3 . C3 . G3 .", "F3 . C4 . F3 . C4 .", "G2 . D3 . G2 . D3 .",
               "C3 . G3 . C3 . G3 .", "C3 . G3 . C3 . G3 .", "F3 . C4 . G2 . D3 .", "C3 . G3 . C3 . . ."),
    perc: bars(". x . x . x . x", ". x . x . x . x", ". x . x . x . x", ". x . x . x . x", ". x . x . x . x", ". x . x . x . x", ". x . x . x . x", ". x . x . x . .") }),
  l1: mkTrack({ bpm: 100, mi: { type: "square", vol: 0.045, pluck: 0.9 },
    mel: bars("A4 . . C5 . E5 . .", "D5 . . C5 . B4 . .", "A4 . . C5 . E5 . G5", "F5 _ E5 . D5 . . .",
              "A4 . C5 . E5 . A5 .", "G5 . E5 . C5 . . .", "D5 . F5 . A5 . G5 .", "E5 _ . . . . . ."),
    bass: bars("A2 . . . E3 . . .", "D3 . . . A3 . . .", "A2 . . . E3 . . .", "D3 . . . A3 . . .",
               "A2 . . . E3 . . .", "C3 . . . G3 . . .", "D3 . . . F3 . . .", "E3 . . . E2 . . ."),
    perc: bars(". . x . . . x .", ". . x . . . x .", ". . x . . . x .", ". . x . . . x .", ". . x . . . x .", ". . x . . . x .", ". . x . . . x .", ". . x . . . . .") }),
  l2: mkTrack({ bpm: 116, mi: { type: "triangle", vol: 0.085, pluck: 0.65 },
    mel: bars("G4 B4 D5 G5 D5 B4 D5 B4", "C5 E5 G5 C6 G5 E5 G5 E5", "D5 F#5 A5 D6 A5 F#5 A5 F#5", "G4 B4 D5 G5 B5 G5 D5 B4",
              "E5 G5 B5 E6 B5 G5 B5 G5", "C5 E5 G5 C6 G5 E5 G5 E5", "D5 F#5 A5 D6 C6 A5 F#5 D5", "G4 B4 D5 G5 _ _ _ ."),
    bass: bars("G2 _ _ _ _ _ _ _", "C3 _ _ _ _ _ _ _", "D3 _ _ _ _ _ _ _", "G2 _ _ _ _ _ _ _",
               "E3 _ _ _ _ _ _ _", "C3 _ _ _ _ _ _ _", "D3 _ _ _ _ _ _ _", "G2 _ _ _ _ _ _ _"),
    bi: { type: "triangle", vol: 0.09, pluck: 0.2 } }),
  l3: mkTrack({ bpm: 138, mi: { type: "square", vol: 0.045, pluck: 0.5, chorus: true },
    mel: bars("D5 D5 F5 D5 A4 D5 C5 A4", "Bb4 Bb4 D5 Bb4 F4 Bb4 A4 F4", "G4 G4 Bb4 G4 D5 G4 F5 D5", "A4 C#5 E5 A5 G5 E5 C#5 A4",
              "D5 D5 F5 D5 A4 D5 C5 A4", "Bb4 Bb4 D5 Bb4 F4 Bb4 A4 F4", "G4 Bb4 D5 G5 A4 C#5 E5 A5", "D5 _ _ _ . . . ."),
    bass: bars("D3 D3 D3 D3 D3 D3 D3 D3", "Bb2 Bb2 Bb2 Bb2 Bb2 Bb2 Bb2 Bb2", "G2 G2 G2 G2 G2 G2 G2 G2", "A2 A2 A2 A2 A2 A2 A2 A2",
               "D3 D3 D3 D3 D3 D3 D3 D3", "Bb2 Bb2 Bb2 Bb2 Bb2 Bb2 Bb2 Bb2", "G2 G2 G2 G2 A2 A2 A2 A2", "D3 _ _ _ D3 . . ."),
    bi: { type: "square", vol: 0.05, pluck: 0.7 },
    perc: bars("x x x x x x x x", "x x x x x x x x", "x x x x x x x x", "x x x x x x x x", "x x x x x x x x", "x x x x x x x x", "x x x x x x x x", "x . . . . . . .") }),
  win: mkTrack({ bpm: 144, loop: false, mi: { type: "square", vol: 0.06, pluck: 0.3, chorus: true },
    mel: "C5 . C5 . C5 E5 G5 _ G5 . F5 . A5 _ G5 _ _ _ C6 _ _ _ _ _ _ .",
    bass: "C3 . . . C3 . . . G2 . . . F3 . . . C3 _ _ _ _ _ _ . . ." }),
  over: mkTrack({ bpm: 80, loop: false, mi: { type: "triangle", vol: 0.09, pluck: 0.4 },
    mel: "E5 _ D5 _ C5 _ B4 _ A4 _ _ _ . . . .",
    bass: "A2 _ _ _ E3 _ _ _ A2 _ _ _ . . . ." })
};

const Music = {
  cur: null, tr: null, step: 0, next: 0, timer: 0, out: null, noise: null,
  want(g) {
    if (!Sfx.musicOn) return null;
    switch (g.state) {
      case ST.TITLE: return "title";
      case ST.PLAY: return g.paused ? null : "l" + Math.min(g.levelIdx, 3);
      case ST.WIN: return "win";
      case ST.OVER: return "over";
      default: return null;
    }
  },
  sync(g) {
    const ctx = Sfx.ctx;
    let w = (ctx && ctx.state === "running") ? this.want(g) : null;
    if (w !== this.cur) { this.stop(); if (w) this.start(w); }
  },
  start(name) {
    const ctx = Sfx.ctx; if (!ctx) return;
    this.cur = name; this.tr = TRACKS[name]; this.step = 0; this.next = ctx.currentTime + 0.06;
    this.out = ctx.createGain(); this.out.gain.value = 1; this.out.connect(ctx.destination);
    if (!this.noise) {
      const n = ctx.createBuffer(1, 2200, ctx.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noise = n;
    }
    this.timer = setInterval(() => this.tick(), 30);
    this.tick();
  },
  stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = 0; }
    if (this.out && Sfx.ctx) {
      try { this.out.gain.setTargetAtTime(0, Sfx.ctx.currentTime, 0.04); const o = this.out; setTimeout(() => { try { o.disconnect(); } catch (e) {} }, 400); } catch (e) {}
    }
    this.out = null; this.cur = null; this.tr = null;
  },
  tick() {
    const ctx = Sfx.ctx, tr = this.tr; if (!ctx || !tr) return;
    const dt = 60 / tr.bpm / 2;
    while (this.next < ctx.currentTime + 0.18) {
      if (this.step >= tr.len) {
        if (tr.loop) this.step = 0; else { clearInterval(this.timer); this.timer = 0; return; }
      }
      this.play(tr, this.step, this.next, dt); this.next += dt; this.step++;
    }
  },
  play(tr, i, t, dt) {
    const mel = tr.mel[i % tr.mel.length], bas = tr.bass[i % tr.bass.length];
    if (mel && mel.m !== null) this.note(mel.m, t, mel.len * dt * 0.96, tr.mi);
    if (bas && bas.m !== null) this.note(bas.m, t, bas.len * dt * 0.96, tr.bi);
    if (tr.perc && tr.perc[i % tr.perc.length] === "x") this.tick8(t);
  },
  note(m, t, dur, ins) {
    const ctx = Sfx.ctx, f = 440 * Math.pow(2, (m - 69) / 12);
    const g = ctx.createGain(); g.connect(this.out);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(ins.vol, t + 0.012);
    if (ins.pluck > 0) g.gain.exponentialRampToValueAtTime(Math.max(0.0002, ins.vol * (1 - ins.pluck) * 0.4), t + dur * 0.92);
    else { g.gain.setValueAtTime(ins.vol * 0.85, t + Math.max(0.02, dur - 0.05)); }
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.02);
    const voices = ins.chorus ? [0, 7] : [0];
    for (const dc of voices) {
      const o = ctx.createOscillator(); o.type = ins.type; o.frequency.value = f; o.detune.value = dc;
      o.connect(g); o.start(t); o.stop(t + dur + 0.05);
    }
  },
  tick8(t) {
    const ctx = Sfx.ctx, s = ctx.createBufferSource(), g = ctx.createGain(), hp = ctx.createBiquadFilter();
    s.buffer = this.noise; hp.type = "highpass"; hp.frequency.value = 6000;
    g.gain.setValueAtTime(0.03, t); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(this.out); s.start(t);
  }
};

/* ------------------------------------------------------------ poziomy */
class Level {
  constructor(code, name, w, theme) {
    this.code = code; this.name = name; this.w = w; this.theme = theme;
    this.tiles = []; for (let y = 0; y < LH; y++) this.tiles.push(new Int8Array(w));
    this.contents = new Map(); this.spawns = [];
    this.goalX = w - 12; this.time = 300; this.hasBoss = false; this.bossMin = 0; this.bossMax = 0;
  }
  get(x, y) { if (x < 0 || x >= this.w) return T.HARD; if (y < 0 || y >= LH) return T.AIR; return this.tiles[y][x]; }
  isSolid(t) { return (t >= 1 && t <= 7) || t === T.LEAF || t === T.GATE; }
  set(x, y, t) { if (x >= 0 && x < this.w && y >= 0 && y < LH) this.tiles[y][x] = t; }
  ground(x1, x2, top = 12) { for (let x = x1; x <= x2; x++) for (let y = top; y < LH; y++) this.tiles[y][x] = T.GROUND; }
  ceiling(rows) { for (let x = 0; x < this.w; x++) for (let y = 0; y < rows; y++) this.tiles[y][x] = T.GROUND; }
  brick(x, y) { this.set(x, y, T.BRICK); }
  brickRow(x, y, n) { for (let i = 0; i < n; i++) this.set(x + i, y, T.BRICK); }
  q(x, y, c) { this.set(x, y, T.QBLOCK); this.contents.set(y * this.w + x, c); }
  leaf(x, y, n) { for (let i = 0; i < n; i++) this.set(x + i, y, T.LEAF); }
  pipe(x, h) { for (let y = 12 - h; y < 12; y++) { this.set(x, y, T.PIPE_L); this.set(x + 1, y, T.PIPE_R); } }
  stairsUp(x, n) { for (let i = 0; i < n; i++) for (let y = 11 - i; y <= 11; y++) this.set(x + i, y, T.HARD); }
  stairsDown(x, n) { for (let i = 0; i < n; i++) for (let y = 12 - n + i; y <= 11; y++) this.set(x + i, y, T.HARD); }
  coin(x, y) { if (this.get(x, y) === T.AIR) this.set(x, y, T.COIN); }
  coinRow(x, y, n) { for (let i = 0; i < n; i++) this.coin(x + i, y); }
  gate(x) { for (let y = 2; y <= 11; y++) this.set(x, y, T.GATE); }
  mob(type, row, ...xs) { for (const x of xs) this.spawns.push({ type, x, y: row }); }
}

const LEVEL_COUNT = 4;
function makeLevel(i) { return [level1, level2, level3, level4][i](); }

function level1() {
  const l = new Level("1-1", "Słoneczna Łąka", 212, 0);
  l.ground(0, 68); l.ground(71, 85); l.ground(89, 153); l.ground(157, 211);
  l.q(16, 8, 0);
  l.brick(20, 8); l.q(21, 8, 1); l.brick(22, 8); l.q(23, 8, 0); l.brick(24, 8);
  l.q(22, 4, 0);
  l.pipe(28, 2); l.pipe(38, 3); l.pipe(46, 4); l.pipe(57, 4);
  l.coinRow(31, 9, 4);
  l.q(64, 8, 2);
  l.coinRow(66, 7, 3);
  l.brickRow(77, 8, 3); l.q(80, 8, 0); l.brickRow(81, 8, 4);
  l.q(81, 4, 3);
  l.coinRow(70, 9, 2);
  l.brick(94, 8); l.q(95, 8, 0); l.brick(96, 8);
  l.pipe(100, 2); l.pipe(108, 3);
  l.brickRow(112, 8, 3); l.q(115, 8, 0); l.brickRow(116, 8, 3);
  l.q(115, 4, 1);
  l.coinRow(120, 9, 5); l.coinRow(130, 7, 6); l.coinRow(153, 8, 4);
  l.stairsUp(184, 8);
  l.goalX = 200;
  l.mob(K.BEETLE, 12, 22, 34, 41, 51, 53, 62, 80, 82, 98, 104, 113, 118, 126, 140, 146, 165, 170, 175);
  l.mob(K.SNAIL, 12, 63, 124, 160);
  l.mob(K.HORNET, 9.5, 69.5, 87, 133, 155);
  l.mob(K.ALEK, 12, 6);
  return l;
}

function level2() {
  const l = new Level("1-2", "Pod Korzeniami", 190, 1);
  l.ground(0, 60); l.ground(64, 120); l.ground(124, 189);
  l.ceiling(3);
  l.q(8, 8, 1); l.brickRow(10, 8, 3); l.q(13, 8, 0);
  l.pipe(20, 2); l.pipe(30, 3); l.pipe(40, 2);
  l.brickRow(50, 8, 9); l.coinRow(51, 11, 7);
  l.q(54, 4, 1);
  l.stairsUp(66, 4); l.stairsDown(70, 4);
  l.q(75, 8, 0); l.q(76, 8, 3); l.q(77, 8, 0);
  l.brickRow(88, 8, 3); l.q(91, 8, 1);
  l.pipe(96, 3); l.pipe(104, 4); l.pipe(114, 2);
  l.coinRow(130, 8, 5);
  l.brickRow(140, 8, 4); l.q(144, 8, 0); l.brickRow(145, 8, 3);
  l.stairsUp(172, 6);
  l.goalX = 182;
  l.mob(K.BEETLE, 12, 15, 24, 34, 44, 54, 56, 80, 84, 95, 100, 107, 128, 134, 142, 150, 158, 164);
  l.mob(K.SNAIL, 12, 90, 110, 138);
  l.mob(K.SPIDER, 3, 25, 35, 46, 80, 99, 120, 127, 150, 160);
  l.mob(K.HORNET, 9.5, 62.5, 122);

}

function level3() {
  const l = new Level("1-3", "Korony Drzew", 200, 2);
  l.ground(0, 8); l.ground(186, 199);
  const leaves = [[10,10,5],[18,10,4],[25,9,6],[34,8,4],[41,9,3],[47,8,6],[57,9,4],[64,10,3],[70,9,5],[78,8,4],
    [85,7,5],[93,8,4],[100,9,3],[106,8,6],[115,9,4],[122,10,3],[128,9,5],[136,8,3],[142,7,4],[149,8,6],
    [158,9,4],[165,10,3],[171,9,4],[178,10,6]];

/* ------------------------------------------------------------ logika gry */
class Ent {
  constructor(type, x, y, w, h) {
    this.type = type; this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = 0; this.vy = 0; this.dir = -1; this.alive = true; this.onGround = false; this.knocked = false;
    this.state = 0; this.timer = 0; this.hp = 1; this.baseX = 0; this.baseY = 0; this.range = 0; this.phase = 0; this.spin = 0;
  }
  get isEnemy() { return this.type >= 1 && this.type <= 5; }
}
const approach = (v, t, a) => (v < t ? Math.min(v + a, t) : Math.max(v - a, t));

class Game {
  constructor() {
    this.state = ST.TITLE; this.hero = 0; this.levelIdx = 0; this.lv = makeLevel(0);
    this.ents = []; this.parts = []; this.bumps = [];
    this.p = new Ent(0, 0, 0, 12, 14);
    this.big = 0; this.facing = 1; this.invuln = 0; this.starT = 0; this.anim = 0;
    this.camX = 0; this.viewW = 400; this.score = 0; this.coins = 0; this.lives = 3; this.time = 300;
    this.tState = 0; this.clearPhase = 0; this.clearWait = 0; this.playerHidden = false; this.paused = false;
    this.bossDead = false; this.frame = 0; this.coyote = 0; this.jbuf = 0;
    this.inLeft = false; this.inRight = false; this.inJump = false; this.inRun = false;
    this.prevJump = false; this.prevRun = false; this.jumpEdge = false; this.runEdge = false;
    this.best = 0;
  }

  startGame() { this.score = 0; this.coins = 0; this.lives = 3; this.big = 0; this.loadLevel(0); }
  tap(x) { if (this.state === ST.TITLE) { this.hero = x < this.viewW / 2 ? 0 : 1; this.startGame(); }
           else if (this.state === ST.OVER || this.state === ST.WIN) this.state = ST.TITLE; }

  loadLevel(idx) {
    this.levelIdx = idx; this.lv = makeLevel(idx);
    this.ents = []; this.parts = []; this.bumps = []; this.bossDead = false;
    for (const s of this.lv.spawns) this.ents.push(this.makeEnt(s));
    const p = this.p;
    p.h = this.big > 0 ? 28 : 14; p.x = 3 * TS; p.y = 12 * TS - p.h; p.vx = 0; p.vy = 0; p.onGround = false;
    this.camX = 0; this.time = this.lv.time; this.invuln = 0; this.starT = 0; this.playerHidden = false; this.facing = 1;
    this.state = ST.INTRO; this.tState = 120;
    if (typeof prewarmArt === "function") prewarmArt(this.lv.theme);
  }

  makeEnt(s) {
    let e;
    switch (s.type) {
      case K.BEETLE: e = new Ent(K.BEETLE, s.x * TS + 1, s.y * TS - 14, 14, 14); break;
      case K.SNAIL: e = new Ent(K.SNAIL, s.x * TS + 1, s.y * TS - 14, 14, 14); break;
      case K.HORNET: e = new Ent(K.HORNET, s.x * TS, s.y * TS, 14, 12); break;
      case K.SPIDER: e = new Ent(K.SPIDER, s.x * TS + 1, s.y * TS, 14, 14); break;
      case K.BOSS: e = new Ent(K.BOSS, s.x * TS, s.y * TS - 24, 28, 24); break;
      default: e = new Ent(K.ALEK, s.x * TS, s.y * TS - 16, 14, 16);
    }
    e.dir = -1;
    if (s.type === K.HORNET) { e.baseX = e.x; e.baseY = e.y; e.range = 48; e.phase = s.x; }
    else if (s.type === K.SPIDER) { e.baseY = e.y; e.range = this.lv.theme === 1 ? 116 : 44; e.phase = s.x * 0.7; }
    else if (s.type === K.BOSS) e.hp = 3;
    return e;
  }

  update() {
    this.frame++;
    this.jumpEdge = this.inJump && !this.prevJump; this.prevJump = this.inJump;
    this.runEdge = this.inRun && !this.prevRun; this.prevRun = this.inRun;
    switch (this.state) {
      case ST.INTRO: this.tState--; if (this.tState <= 0) this.state = ST.PLAY; break;
      case ST.PLAY: if (!this.paused) this.updatePlay(); break;
      case ST.DYING: this.updateDying(); break;
      case ST.CLEAR: this.updateClear(); break;
    }
  }

  updatePlay() {
    this.time -= 1 / 24;
    if (this.time <= 0) { this.die(); return; }
    if (this.invuln > 0) this.invuln--;
    if (this.starT > 0) this.starT--;
    this.updatePlayer();
    if (this.state !== ST.PLAY) return;
    for (let i = 0; i < this.ents.length; i++) this.updateEnt(this.ents[i]);
    this.playerVsEnts();
    this.ents = this.ents.filter(e => e.alive);
    for (const pt of this.parts) { pt.x += pt.vx; pt.y += pt.vy; if (pt.kind === 0) pt.vy += 0.3; pt.life--; }
    this.parts = this.parts.filter(pt => pt.life > 0);
    for (const b of this.bumps) b.t++;
    this.bumps = this.bumps.filter(b => b.t <= 8);
    this.updateCamera();
    if (this.state === ST.PLAY && this.p.x + this.p.w >= this.lv.goalX * TS + 6) this.startClear();
  }

  updateCamera() {
    const target = this.p.x + this.p.w / 2 - this.viewW * 0.45;
    if (target > this.camX) this.camX = target;
    this.camX = Math.min(Math.max(this.camX, 0), Math.max(0, this.lv.w * TS - this.viewW));
  }

  updatePlayer() {
    const p = this.p, lv = this.lv;
    const dirIn = (this.inRight ? 1 : 0) - (this.inLeft ? 1 : 0);
    const gucio = this.hero === 1;
    const maxS = this.inRun ? 2.5 : 1.5;
    const acc = this.inRun ? 0.07 : 0.05;
    const fric = gucio ? 0.03 : 0.07;
    const skid = gucio ? 0.09 : 0.16;
    if (dirIn !== 0) {
      this.facing = dirIn;
      if (p.vx * dirIn < 0) p.vx += dirIn * (p.onGround ? skid : 0.07);
      else if (Math.abs(p.vx) > maxS) p.vx = approach(p.vx, dirIn * maxS, 0.03);
      else p.vx = approach(p.vx, dirIn * maxS, p.onGround ? acc : 0.05);
    } else p.vx = approach(p.vx, 0, p.onGround ? fric : 0.01);

    if (this.jumpEdge) this.jbuf = 5; else if (this.jbuf > 0) this.jbuf--;
    if (p.onGround) this.coyote = 4; else if (this.coyote > 0) this.coyote--;
    if (this.jbuf > 0 && this.coyote > 0) {
      const boost = gucio ? 1.12 : 1;
      p.vy = -(4.3 + Math.abs(p.vx) * 0.32) * boost;
      p.onGround = false; this.coyote = 0; this.jbuf = 0;
      Sfx.play("jump");
    }
    const g = (p.vy < 0 && this.inJump) ? 0.15 : 0.44;
    p.vy = Math.min(p.vy + g, 4.8);

    if (this.moveX(p)) p.vx = 0;
    if (p.x < this.camX) { p.x = this.camX; if (p.vx < 0) p.vx = 0; }
    const maxX = lv.w * TS - p.w;
    if (p.x > maxX) p.x = maxX;
    this.moveY(p, true);

    if (p.y > LH * TS + 8) { this.die(); return; }
    if (this.big > 0 && p.h < 20 && this.free(p.x, p.y - 14, p.w, 14)) { p.y -= 14; p.h = 28; }
    this.anim += p.onGround ? Math.abs(p.vx) * 0.22 : 0.25;
    this.collectCoins();
    if (this.runEdge && this.big === 2) this.shoot();
  }

  free(x, y, w, h) {
    const l = Math.floor(x / TS), r = Math.floor((x + w - 0.01) / TS);
    const t = Math.floor(y / TS), b = Math.floor((y + h - 0.01) / TS);
    for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++) if (this.lv.isSolid(this.lv.get(tx, ty))) return false;
    return true;
  }

  collectCoins() {
    const p = this.p, lv = this.lv;
    const l = Math.floor(p.x / TS), r = Math.floor((p.x + p.w - 0.01) / TS);
    const t = Math.floor(p.y / TS), b = Math.floor((p.y + p.h - 0.01) / TS);
    for (let ty = t; ty <= b; ty++) for (let tx = l; tx <= r; tx++)
      if (lv.get(tx, ty) === T.COIN) { lv.set(tx, ty, T.AIR); this.addCoin(); }
  }

  addCoin() {
    this.coins++; this.score += 200; Sfx.play("coin");
    if (this.coins >= 100) { this.coins -= 100; this.lives++; Sfx.play("oneup"); }
  }

  shoot() {
    let n = 0; for (const e of this.ents) if (e.type === K.SHOT && e.alive) n++;
    if (n >= 2) return;
    const p = this.p;
    const s = new Ent(K.SHOT, this.facing > 0 ? p.x + p.w : p.x - 6, p.y + p.h * 0.4, 6, 6);
    s.dir = this.facing; this.ents.push(s); Sfx.play("shoot");
  }

  moveX(e) {
    if (e.vx === 0) return false;
    e.x += e.vx;
    const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - 0.01) / TS);
    const t = Math.floor(e.y / TS), b = Math.floor((e.y + e.h - 0.01) / TS);
    const tx = e.vx > 0 ? r : l;
    for (let ty = t; ty <= b; ty++) {
      if (this.lv.isSolid(this.lv.get(tx, ty))) { e.x = e.vx > 0 ? tx * TS - e.w : (tx + 1) * TS; return true; }
    }
    return false;
  }

  moveY(e, player) {
    e.onGround = false;
    e.y += e.vy;
    const lv = this.lv;
    const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - 0.01) / TS);
    const t = Math.floor(e.y / TS), b = Math.floor((e.y + e.h - 0.01) / TS);
    if (e.vy > 0) {
      for (let tx = l; tx <= r; tx++) if (lv.isSolid(lv.get(tx, b))) { e.y = b * TS - e.h; e.vy = 0; e.onGround = true; return true; }
    } else if (e.vy < 0) {
      let hit = -1;
      const cx = Math.floor((e.x + e.w / 2) / TS);
      if (lv.isSolid(lv.get(cx, t))) hit = cx;
      else for (let tx = l; tx <= r; tx++) if (lv.isSolid(lv.get(tx, t))) { hit = tx; break; }
      if (hit >= 0) { e.y = (t + 1) * TS; e.vy = 0; if (player) this.bumpBlock(hit, t); return true; }
    }
    return false;
  }

  bumpBlock(tx, ty) {
    const lv = this.lv, tile = lv.get(tx, ty);
    if (tile === T.QBLOCK) {
      const c = lv.contents.get(ty * lv.w + tx) || 0;
      lv.set(tx, ty, T.USED); this.bumps.push({ tx, ty, t: 0 }); this.spawnContent(tx, ty, c);
    } else if (tile === T.BRICK) {
      if (this.big > 0) { lv.set(tx, ty, T.AIR); this.breakParts(tx, ty, lv.theme); this.score += 50; Sfx.play("break"); }
      else { this.bumps.push({ tx, ty, t: 0 }); Sfx.play("bump"); }
    }
    for (const e of this.ents) {
      if (e.alive && !e.knocked && e.isEnemy && e.type !== K.BOSS && e.type !== K.SPIDER &&
          Math.abs(e.x + e.w / 2 - (tx * TS + 8)) < 12 && Math.abs(e.y + e.h - ty * TS) < 3) this.knock(e);
    }
  }

  spawnContent(tx, ty, c) {
    if (c === 0) { this.addCoin(); this.parts.push({ kind: 1, x: tx * TS + 4, y: ty * TS - 8, vx: 0, vy: -4, life: 28, color: 0 }); return; }
    const type = c === 1 ? (this.big === 0 ? K.HONEY : K.FLOWER) : c === 2 ? K.ONEUP : K.STAR;
    const it = new Ent(type, tx * TS + 1, ty * TS + 2, 14, 14);
    it.state = 1; it.timer = 16; it.dir = 1;
    this.ents.push(it); Sfx.play("item");
  }

  breakParts(tx, ty, theme) {
    const colr = theme === 1 ? 0xFF7A5A48 : theme === 3 ? 0xFFD9A03A : 0xFFC8743C;
    const xs = [-1.5, 1.5, -1, 1], ys = [-4.5, -4.5, -3, -3];
    for (let i = 0; i < 4; i++)
      this.parts.push({ kind: 0, x: tx * TS + (i % 2 === 0 ? 2 : 9), y: ty * TS + (i < 2 ? 2 : 9), vx: xs[i], vy: ys[i], life: 70, color: colr });
  }

  overlapP(e, m) {
    const p = this.p;
    return p.x < e.x + e.w - m && p.x + p.w > e.x + m && p.y < e.y + e.h - m && p.y + p.h > e.y + m;
  }
  overlapEE(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  knock(o) {
    o.knocked = true; o.vy = -3; o.vx = this.p.x < o.x ? 1 : -1; this.score += 100; Sfx.play("kick");
  }

  damageBoss(e) {
    if (e.timer > 0 || e.knocked) return;
    e.hp--; e.timer = 80; Sfx.play("boss");
    if (e.hp <= 0) { e.knocked = true; e.vy = -4; e.vx = 0.5; this.bossDead = true; this.score += 5000; this.openGate(); }
  }

  openGate() {
    const lv = this.lv;
    for (let y = 0; y < LH; y++) for (let x = 0; x < lv.w; x++)
      if (lv.tiles[y][x] === T.GATE) { lv.tiles[y][x] = T.AIR; this.breakParts(x, y, 3); }
  }

  updateEnt(e) {
    if (!e.alive) return;
    if (e.x + e.w < this.camX - 150) { e.alive = false; return; }
    if (e.x > this.camX + this.viewW + 24 && e.type < K.HONEY) return;
    if (e.knocked) {
      e.vy += 0.3; e.y += e.vy; e.x += e.vx; e.spin += 0.3;
      if (e.y > LH * TS + 40) e.alive = false;
      return;
    }
    const lv = this.lv;
    switch (e.type) {
      case K.BEETLE:
        if (e.state === -1) { e.timer--; if (e.timer <= 0) e.alive = false; return; }
        e.vx = e.dir * 0.5; e.vy = Math.min(e.vy + 0.3, 4);
        if (this.moveX(e)) e.dir = -e.dir;
        this.moveY(e, false);
        if (e.y > LH * TS + 16) e.alive = false;
        break;
      case K.SNAIL:
        if (e.timer > 0) e.timer--;
        e.vy = Math.min(e.vy + 0.3, 4);
        e.vx = e.state === 0 ? e.dir * 0.45 : e.state === 1 ? 0 : e.dir * 3;
        if (this.moveX(e)) { e.dir = -e.dir; if (e.state === 2) Sfx.play("bump"); }
        this.moveY(e, false);
        if (e.state === 2) for (const o of this.ents)
          if (o !== e && o.alive && !o.knocked && o.isEnemy && o.type !== K.BOSS && this.overlapEE(e, o)) this.knock(o);
        if (e.y > LH * TS + 16) e.alive = false;
        break;
      case K.HORNET:
        e.phase += 0.08; e.x += e.dir * 0.7;
        if (e.x - e.baseX > e.range) e.dir = -1; else if (e.x - e.baseX < -e.range) e.dir = 1;
        e.y = e.baseY + Math.sin(e.phase) * 18;
        break;
      case K.SPIDER:
        e.phase += 0.035; e.y = e.baseY + (1 - Math.cos(e.phase)) * 0.5 * e.range;
        break;
      case K.BOSS: {
        if (e.timer > 0) e.timer--;
        e.state++;
        e.vy = Math.min(e.vy + 0.3, 4.5);
        e.vx = e.dir * (0.6 + (3 - e.hp) * 0.3);
        if (this.moveX(e)) e.dir = -e.dir;
        const mn = lv.bossMin * TS, mx = lv.bossMax * TS;
        if (e.x < mn) { e.x = mn; e.dir = 1; }
        if (e.x + e.w > mx) { e.x = mx - e.w; e.dir = -1; }
        this.moveY(e, false);
        if (e.onGround && e.state >= 110) { e.vy = -5.2; e.state = 0; }
        break;
      }
      case K.HONEY: case K.FLOWER: case K.ONEUP: case K.STAR:
        if (e.state === 1) {
          e.y -= 1; e.timer--;
          if (e.timer <= 0) { e.state = 0; if (e.type === K.STAR) e.vy = -3; }
          return;
        }
        if (e.type !== K.FLOWER) {
          e.vx = e.dir * (e.type === K.STAR ? 1.0 : 0.7);
          e.vy = Math.min(e.vy + 0.25, 4);
          if (this.moveX(e)) e.dir = -e.dir;
          this.moveY(e, false);
          if (e.type === K.STAR && e.onGround) e.vy = -3.6;
        }
        if (e.y > LH * TS + 16) { e.alive = false; return; }
        if (this.overlapP(e, 0)) this.pickup(e);
        break;
      case K.SHOT:
        e.timer++;
        e.vx = e.dir * 3.4; e.vy = Math.min(e.vy + 0.28, 4);
        if (this.moveX(e)) { e.alive = false; return; }
        this.moveY(e, false);
        if (e.onGround) e.vy = -2.8;
        if (e.timer > 200 || e.x > this.camX + this.viewW + 20 || e.x < this.camX - 20 || e.y > LH * TS) { e.alive = false; return; }
        for (const o of this.ents) {
          if (o.alive && !o.knocked && o.isEnemy && this.overlapEE(e, o)) {
            if (o.type === K.BOSS) this.damageBoss(o); else this.knock(o);
            e.alive = false; break;
          }
        }
        break;
    }
  }

  pickup(e) {
    e.alive = false;
    switch (e.type) {
      case K.HONEY: if (this.big === 0) { this.big = 1; Sfx.play("grow"); } else Sfx.play("item"); this.score += 1000; break;
      case K.FLOWER: this.big = this.big === 0 ? 1 : 2; this.score += 1000; Sfx.play("grow"); break;
      case K.ONEUP: this.lives++; Sfx.play("oneup"); break;
      case K.STAR: this.starT = 600; this.score += 1000; Sfx.play("item"); break;
    }
  }

  playerVsEnts() {
    if (this.state !== ST.PLAY) return;
    const p = this.p;
    for (const e of this.ents) {
      if (!e.alive || e.knocked || !e.isEnemy || e.state === -1) continue;
      if (e.type === K.BOSS && e.timer > 0) continue;
      if (!this.overlapP(e, 1.5)) continue;
      const stomp = p.vy > 0 && (p.y + p.h) - e.y < 10 && e.type !== K.SPIDER;
      if (e.type === K.SNAIL && e.state === 1) {
        if (e.timer > 0) continue;
        if (stomp) this.stompEnemy(e); else this.kickShell(e);
        continue;
      }
      if (e.type === K.SNAIL && e.state === 2 && e.timer > 0) continue;
      if (this.starT > 0) { if (e.type === K.BOSS) this.damageBoss(e); else this.knock(e); continue; }
      if (stomp) this.stompEnemy(e); else this.hurt();
    }
  }

  kickShell(e) {
    e.state = 2; e.dir = (this.p.x + this.p.w / 2 < e.x + e.w / 2) ? 1 : -1; e.timer = 10; Sfx.play("kick");
  }

  stompEnemy(e) {
    const p = this.p;
    switch (e.type) {
      case K.BEETLE: e.state = -1; e.timer = 20; e.vx = 0; this.score += 100; break;
      case K.SNAIL:
        if (e.state === 0) { e.state = 1; e.h = 12; e.y += 2; e.timer = 10; this.score += 100; }
        else if (e.state === 1) { this.kickShell(e); this.score += 400; }
        else { e.state = 1; e.vx = 0; e.timer = 10; this.score += 100; }
        break;
      case K.HORNET: this.knock(e); break;
      case K.BOSS: this.damageBoss(e); break;
    }
    Sfx.play("stomp");
    p.vy = this.inJump ? -4.6 : -3.2;
    p.y = Math.min(p.y, e.y - p.h);
    p.onGround = false;
    if (e.type === K.BOSS) p.vx = p.x < e.x ? -1.6 : 1.6;
  }

  hurt() {
    if (this.invuln > 0 || this.starT > 0) return;
    if (this.big > 0) {
      this.big = 0;
      if (this.p.h > 20) { this.p.y += 14; this.p.h = 14; }
      this.invuln = 100; Sfx.play("shrink");
    } else this.die();
  }

  die() {
    if (this.state !== ST.PLAY) return;
    this.state = ST.DYING; this.tState = 0;
    this.p.vy = -5; this.big = 0; this.starT = 0;
    if (this.p.h > 20) { this.p.y += 14; this.p.h = 14; }
    Sfx.play("die");
  }

  updateDying() {
    this.tState++;
    if (this.tState > 25) { this.p.vy = Math.min(this.p.vy + 0.3, 5); this.p.y += this.p.vy; }
    if (this.tState > 160) {
      this.lives--;
      if (this.lives <= 0) this.endRun(ST.OVER); else this.loadLevel(this.levelIdx);
    }
  }

  endRun(st) {
    this.state = st;
    if (this.score > this.best) { this.best = this.score; try { localStorage.setItem("maja-best", String(this.best)); } catch (e) {} }
  }

  startClear() {
    const p = this.p;
    this.state = ST.CLEAR; this.clearPhase = 0; this.clearWait = 0;
    p.x = this.lv.goalX * TS + 7 - p.w; p.vx = 0; p.vy = 0; this.facing = 1;
    this.score += Math.max(100, Math.floor((12 * TS - p.y) / TS * 400));

  }

  updateClear() {
    const p = this.p;
    this.updateCamera();
    if (this.clearPhase === 0) {
      p.y += 1.6; this.anim += 0.2;
      if (p.y + p.h >= 12 * TS) { p.y = 12 * TS - p.h; p.x = this.lv.goalX * TS + 9; this.clearPhase = 1; }
    } else if (this.clearPhase === 1) {
      p.x += 1.3; this.anim += 0.25;
      if (p.x > (this.lv.goalX + 6) * TS) { this.clearPhase = 2; this.playerHidden = true; }
    } else if (this.time > 0) {
      const d = Math.min(this.time, 2);
      this.time -= d; this.score += Math.floor(d * 50);
      if (this.frame % 3 === 0) Sfx.play("tick");
    } else {
      this.clearWait++;
      if (this.clearWait > 70) {
        if (this.levelIdx + 1 >= LEVEL_COUNT) this.endRun(ST.WIN); else this.loadLevel(this.levelIdx + 1);
      }
    }
  }
}

/* --- rozmiary, układ ekranu (marginesy ze sterowaniem) i wejście --- */
const PANEL = "#16200f";
let W = 1, H = 1, ratio = 1, qAdapt = 1;
let cssRect = { left: 0, top: 0, width: 1, height: 1 };
let isTouch = window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : (navigator.maxTouchPoints > 0);
let layoutMode = "split";                      // "split": ◀ + SKOK z lewej, ▶ + STRZAŁ z prawej; "classic": ruch z lewej, akcje z prawej
try { if (localStorage.getItem("maja-layout") === "classic") layoutMode = "classic"; } catch (e) {}
const L = { gx: 0, gy: 0, gw: 1, gh: 1, sc: 1, buttons: [] };
const fsOK = () => !!(document.fullscreenEnabled && cv.requestFullscreen);

function resize() {
  const r = cv.getBoundingClientRect();
  cssRect = r;
  const cw = Math.max(1, r.width), ch = Math.max(1, r.height);
  // Ograniczamy rozdzielczość bufora: mniej pikseli = płynniej i mniejsze opóźnienie w WebView
  let q = Math.min(window.devicePixelRatio || 1, 2);
  q = Math.min(q, Math.sqrt(0.9e6 / (cw * ch)));
  q = Math.max(0.5, q * qAdapt);
  const nw = Math.max(1, Math.round(cw * q)), nh = Math.max(1, Math.round(ch * q));
  if (cv.width !== nw || cv.height !== nh) { cv.width = nw; cv.height = nh; curFont = ""; }
  W = cv.width; H = cv.height; ratio = W / cw;
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

function btn(B, id, x, y, w, h, label, small) { B.push({ id, x, y, w, h, label, small: !!small }); }

function computeLayout() {
  const MIN_VW = 330, B = [];
  let sc, vw, gx = 0, gy = 0;
  const landscape = W > H * 1.25;
  if (isTouch && landscape) {
    // marginesy po bokach: [ sterowanie | gra | sterowanie ]
    let m = (W - H * 1.6) / 2;
    m = Math.min(Math.max(m, W * 0.15), W * 0.27);
    const aw = W - 2 * m;
    sc = H / 224; vw = aw / sc;
    if (vw < MIN_VW) { sc = aw / MIN_VW; vw = MIN_VW; }
    gx = m; gy = (H - 224 * sc) / 2; L.gw = aw;
    const pad = H * 0.025, sz = Math.min(m * 0.36, H * 0.13);
    const y0 = pad * 3 + sz, avail = H - pad - y0, h1 = avail * 0.46, h2 = avail - h1;
    if (layoutMode === "split") {
      btn(B, "left",  0,     y0,      m, h1, "");
      btn(B, "jump",  0,     y0 + h1, m, h2, "SKOK");
      btn(B, "right", W - m, y0,      m, h1, "");
      btn(B, "run",   W - m, y0 + h1, m, h2, "BIEG|STRZAŁ");
    } else {
      btn(B, "left",  0,     y0, m / 2, avail, "");
      btn(B, "right", m / 2, y0, m / 2, avail, "");
      btn(B, "run",   W - m, y0,      m, h1, "BIEG|STRZAŁ");
      btn(B, "jump",  W - m, y0 + h1, m, h2, "SKOK");
    }
    btn(B, "pause",  m / 2 - sz - pad / 2, pad * 1.5, sz, sz, "", true);
    btn(B, "sound",  m / 2 + pad / 2,      pad * 1.5, sz, sz, "", true);
    btn(B, "layout", W - m / 2 - sz - pad / 2, pad * 1.5, sz, sz, "", true);
    if (fsOK()) btn(B, "fs", W - m / 2 + pad / 2, pad * 1.5, sz, sz, "", true);
  } else if (isTouch) {
    // pionowo: gra u góry, sterowanie pod spodem
    sc = W / MIN_VW; vw = MIN_VW; L.gw = W;
    const gh = 224 * sc, pad = W * 0.02, sz = W * 0.09;
    const y0 = gh + pad, avail = H - y0 - pad, r1 = avail * 0.6, r2 = avail - r1;
    btn(B, "left",  0,         y0,      W * 0.25, r1, "");
    btn(B, "right", W * 0.25,  y0,      W * 0.25, r1, "");
    btn(B, "jump",  W * 0.5,   y0,      W * 0.5,  r1, "SKOK");
    btn(B, "run",   0,         y0 + r1, W,        r2, "BIEG|STRZAŁ");
    btn(B, "pause", W - sz * 3.4, pad, sz, sz, "", true);
    btn(B, "sound", W - sz * 2.2, pad, sz, sz, "", true);
    if (fsOK()) btn(B, "fs", W - sz * 1.1, pad, sz, sz, "", true);
  } else {
    sc = H / 224; vw = W / sc;
    if (vw < MIN_VW) { sc = W / MIN_VW; vw = MIN_VW; }

    const sz = Math.max(28, H * 0.07), pad = sz * 0.3;
    btn(B, "pause", W - sz - pad, gy + pad, sz, sz, "", true);
    btn(B, "sound", W - 2 * sz - 2 * pad, gy + pad, sz, sz, "", true);
    if (fsOK()) btn(B, "fs", W - 3 * sz - 3 * pad, gy + pad, sz, sz, "", true);
  }
  L.gx = gx; L.gy = gy; L.sc = sc; L.gh = 224 * sc; L.buttons = B;
  game.viewW = vw;
}

function hitBtn(x, y) {
  const B = L.buttons;
  for (let i = B.length - 1; i >= 0; i--) {          // małe przyciski mają pierwszeństwo
    const b = B[i], m = b.small ? b.w * 0.15 : 0;
    if (x >= b.x - m && x <= b.x + b.w + m && y >= b.y - m && y <= b.y + b.h + m) return b;
  }

const pointers = new Map();
const kb = { left: false, right: false, jump: false, run: false };
function syncInput() {
  let l = false, r = false, j = false, b = false;
  for (const pt of pointers.values()) {
    const h = hitBtn(pt.x, pt.y); if (!h) continue;
    switch (h.id) { case "left": l = true; break; case "right": r = true; break; case "jump": j = true; break; case "run": b = true; break; }
  }

  } else {
    const h = hitBtn(p.x, p.y), id = h ? h.id : "";

cv.addEventListener("pointerdown", onDown);
cv.addEventListener("pointermove", onMove);
cv.addEventListener("pointerup", onUp);
cv.addEventListener("pointercancel", onUp);
cv.addEventListener("contextmenu", e => e.preventDefault());

const keyMap = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  Space: "jump", KeyZ: "jump", ArrowUp: "jump", KeyW: "jump",
  ShiftLeft: "run", ShiftRight: "run", KeyX: "run", KeyJ: "run"

window.addEventListener("keydown", e => {
  Sfx.unlock();

  if (st === ST.TITLE) {
    if (code === "ArrowLeft" || code === "KeyA") game.hero = 0;
    else if (code === "ArrowRight" || code === "KeyD") game.hero = 1;

function render() {
  computeLayout();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PANEL; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.rect(L.gx, L.gy, L.gw, L.gh); ctx.clip();
  ctx.translate(L.gx, L.gy); ctx.scale(L.sc, L.sc);

  if (g.state === ST.TITLE) drawTitle();
  else if (g.state === ST.INTRO) drawIntro();

      fill(0, 0, vw, 224, 0xAA000000);
      txt("KONIEC GRY", vw / 2, 100, 26, 0xFFFF5252, "center");
      txt("Wynik: " + g.score + "   Rekord: " + g.best, vw / 2, 124, 12, WHITE, "center");
      txt("Dotknij ekranu lub naciśnij Enter, aby wrócić do menu", vw / 2, 150, 9, WHITE, "center");
    } else if (g.state === ST.WIN) drawWin();
    else if (g.paused) {
      fill(0, 0, vw, 224, 0x99000000);
      txt("PAUZA", vw / 2, 110, 24, WHITE, "center");
      txt("Dotknij ekranu lub naciśnij dowolny klawisz", vw / 2, 132, 9, WHITE, "center");

function rr(x, y, w, h, r) {

}

function drawControls() {
  const st = game.state;
  if (!(st === ST.PLAY || st === ST.DYING || st === ST.CLEAR)) return;
  const pr = { left: game.inLeft, right: game.inRight, jump: game.inJump, run: game.inRun,

function drawBig(b, on) {

  ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.strokeStyle = "rgba(255,255,255,0.9)";

    case "pause": ctx.fillRect(cx - r * 0.35, cy - r * 0.4, r * 0.25, r * 0.8); ctx.fillRect(cx + r * 0.1, cy - r * 0.4, r * 0.25, r * 0.8); break;

      ctx.beginPath(); ctx.moveTo(cx - r * 0.27, cy - r * 0.2); ctx.lineTo(cx + r * 0.1, cy - r * 0.5); ctx.lineTo(cx + r * 0.1, cy + r * 0.5); ctx.lineTo(cx - r * 0.27, cy + r * 0.2); ctx.closePath(); ctx.fill();

      ctx.moveTo(cx + a, cy + a - k); ctx.lineTo(cx + a, cy + a); ctx.lineTo(cx + a - k, cy + a);

    }

function waxFill(g, x, y, w, h, p, v) {       // plaster miodu zamiast ziemi

function drawAlek(cx, by, e) {

  for (const s of [-1, 1]) {
    if (e.quiet) { curve(ctx, s * 2.2 - 1.6, -14.2, s * 2.2, -13.2, s * 2.2 + 1.6, -14.2, INK, 0.7); continue; }
    ell(ctx, s * 2.2, -14.4, 1.8, 1.5, "#fff", INK, 0.5); ell(ctx, s * 2.2, -13.9, 0.7, 0.7, "#221"); rrp(ctx, s * 2.2 - 2, -16.4, 4, 1.9, 0.9); ctx.fillStyle = "#e8962a"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 0.5; ctx.stroke(); }
  curve(ctx, -1.8, -10.6, 0, -11.6, 1.8, -10.6, INK, 0.6);
  ctx.restore();
  const dx = Math.abs(game.p.x + game.p.w / 2 - cx);
  const msgs = ["Zzz... Skacz po wrogach!", "Tekla czyha na korzeniach!", "Ale wysoko... ja zostaję tu.", "Pokonaj Teklę, wróć do ula!"];
  if (e.quiet) return;
  if (dx < 70) {
    const s = msgs[Math.min(game.levelIdx, 3)], tw = measure(s, 6.5);
    rrp(ctx, cx - tw / 2 - 4, by - 40, tw + 8, 12, 4); ctx.fillStyle = "rgba(255,250,235,0.96)"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 0.7; ctx.stroke();
    polyO([cx - 2, by - 28.4, cx + 1, by - 28.4, cx - 0.5, by - 25.6], "rgba(255,250,235,0.96)", INK, 0.6);
    ctx.fillStyle = "#3b2412"; setFont(6.5); ctx.textAlign = "center"; ctx.fillText(s, cx, by - 31.5);
  } else txt((Math.floor(game.frame / 40) % 2 === 0) ? "z" : "Z", cx + 8, by - 22, 7, WHITE, "left");
}

function drawHero(cx, by, w, h, face, anim, hero, air) {
  ctx.save();
  ctx.translate(cx, by);
  const k = h > 20 ? 1.55 : 1;
  ctx.scale(face * k, k);
  if (hero === 0) drawMaja(anim, air); else drawGucio(anim, air);
  ctx.restore();
}

function drawMaja(anim, air) {
  const flap = Math.sin(anim * 1.8) * (air ? 24 : 9), leg = air ? 1.2 : Math.sin(anim * 1.6) * 1.5;
  rotAround(-24 + flap, -1.5, -8, () => ell(ctx, -4.6, -13.2, 2.7, 6.2, "rgba(240,250,255,0.55)", "rgba(255,255,255,0.95)", 0.55));
  rotAround(-6 - flap, 0, -8, () => ell(ctx, -1.5, -13.8, 2.4, 5.6, "rgba(240,250,255,0.4)", "rgba(255,255,255,0.85)", 0.5));
  for (const s of [-1, 1]) { const x = s * 1.9 - 0.4, f = s * leg; limb(x, -2.6, x + f, -0.6, "#f4b52e", 1.0); ell(ctx, x + f + 0.8, -0.4, 1.5, 0.8, "#f08a1e", INK, 0.5); }
  ctx.save(); ctx.beginPath(); ctx.ellipse(-0.6, -5.6, 5.1, 3.9, 0, 0, PI * 2); ctx.clip();
  ctx.fillStyle = lgrad(ctx, 0, -9.6, 0, -1.7, [[0, "#ffd24a"], [1, "#f2a81e"]]); ctx.fillRect(-7, -10, 14, 9);
  ctx.fillStyle = "#33190b"; ctx.fillRect(-4.2, -10, 1.7, 9); ctx.fillRect(-0.9, -10, 1.7, 9); ctx.fillRect(2.4, -10, 1.7, 9);
  ctx.restore();
  ell(ctx, -0.6, -5.6, 5.1, 3.9, null, INK, 0.8);
  polyO([-5.4, -6.4, -8.4, -5.4, -5.4, -4.4], "#33190b", INK, 0.45);
  const hair = "#f2a51d", hairL = "#ffc83a";
  for (const q of [[-1.8, -12.2, 2.9], [0.4, -15.2, 3.0], [3.5, -16.2, 3.0], [6.4, -14.6, 2.6], [7.8, -11.6, 2.3], [-2.6, -9.6, 2.1]]) ell(ctx, q[0], q[1], q[2], q[2], hair, INK, 0.6);
  ell(ctx, 3.0, -10.6, 5.2, 5.0, rgrad(ctx, 4, -12, 0.5, 6.5, [[0, "#ffe27a"], [1, "#f7b92c"]]), INK, 0.8);
  for (const q of [[1.6, -14.6, 2.0], [4.5, -15.0, 1.9], [6.7, -13.2, 1.5]]) ell(ctx, q[0], q[1], q[2], q[2], hairL, INK, 0.55);
  curve(ctx, 1.6, -18.6, 0.2, -22, -1.8, -22.4, INK, 0.55); curve(ctx, 5.0, -19, 5.8, -22.6, 8.2, -22.8, INK, 0.55);
  ell(ctx, 4.9, -10.9, 1.9, 2.4, "#fff", INK, 0.5); ell(ctx, 5.5, -10.7, 1.0, 1.4, "#2a1608"); ell(ctx, 5.8, -11.3, 0.35, 0.4, "#fff");
  curve(ctx, 3.3, -13.6, 4.9, -14.2, 6.5, -13.3, INK, 0.5);
  ell(ctx, 2.2, -8.6, 1.1, 0.8, "rgba(240,120,90,0.45)");
  ell(ctx, 7.9, -9.8, 0.55, 0.5, "#e08a30");
  if (air) { ell(ctx, 5.9, -7.2, 1.9, 1.3, "#8a1f1a", INK, 0.4); ell(ctx, 5.9, -6.7, 1, 0.55, "#ff8a80"); }
  else curve(ctx, 3.6, -7.6, 5.4, -6.3, 7.3, -7.9, INK, 0.6);
}

function drawGucio(anim, air) {              // Gucio: pszczoła, samiec
  const flap = Math.sin(anim * 1.8) * (air ? 24 : 9), leg = air ? 1.2 : Math.sin(anim * 1.6) * 1.5;
  rotAround(-24 + flap, -1.5, -8, () => ell(ctx, -4.6, -13.2, 2.7, 6.2, "rgba(240,250,255,0.55)", "rgba(255,255,255,0.95)", 0.55));
  rotAround(-6 - flap, 0, -8, () => ell(ctx, -1.5, -13.8, 2.4, 5.6, "rgba(240,250,255,0.4)", "rgba(255,255,255,0.85)", 0.5));
  for (const s of [-1, 1]) { const x = s * 2.1 - 0.4, f = s * leg; limb(x, -2.6, x + f, -0.6, "#f0a22a", 1.1); ell(ctx, x + f + 0.9, -0.4, 1.6, 0.85, "#d9701a", INK, 0.5); }
  ctx.save(); ctx.beginPath(); ctx.ellipse(-0.6, -5.7, 5.6, 4.2, 0, 0, PI * 2); ctx.clip();
  ctx.fillStyle = lgrad(ctx, 0, -10, 0, -1.5, [[0, "#ffc43a"], [1, "#e8901c"]]); ctx.fillRect(-7, -10, 14, 9);
  ctx.fillStyle = "#33190b"; ctx.fillRect(-4.6, -10, 2, 9); ctx.fillRect(-0.9, -10, 2, 9); ctx.fillRect(2.8, -10, 2, 9);
  ctx.restore();
  ell(ctx, -0.6, -5.7, 5.6, 4.2, null, INK, 0.8);
  polyO([-5.8, -6.5, -9, -5.4, -5.8, -4.3], "#33190b", INK, 0.45);
  // głowa z krótką, zaczesaną brązową czupryną (bez loków jak u Mai)
  ell(ctx, 3.0, -10.4, 5.3, 4.9, rgrad(ctx, 4, -12, 0.5, 6.5, [[0, "#ffd96a"], [1, "#f2a22a"]]), INK, 0.8);
  ell(ctx, 2.2, -14.6, 4.8, 2.4, "#b8651a", INK, 0.6);
  ell(ctx, 6.4, -14.0, 1.9, 1.5, "#c9741f", INK, 0.5);
  ell(ctx, -0.4, -15.4, 1.5, 1.4, "#b8651a", INK, 0.5);
  curve(ctx, 1.6, -16.4, 0.4, -20.4, -1.4, -21.2, INK, 0.75); curve(ctx, 4.8, -16.4, 5.4, -20.6, 7.8, -21.4, INK, 0.75);
  ell(ctx, -1.6, -21.3, 0.8, 0.8, INK); ell(ctx, 8.1, -21.5, 0.8, 0.8, INK);
  ell(ctx, 4.9, -10.6, 1.9, 2.3, "#fff", INK, 0.5); ell(ctx, 5.5, -10.5, 1.0, 1.4, "#2a1608"); ell(ctx, 5.8, -11.1, 0.35, 0.4, "#fff");
  ln(ctx, 3.0, -13.2, 6.8, -12.4, INK, 0.7);                       // zdecydowana brew
  ell(ctx, 7.9, -9.5, 0.6, 0.55, "#d9701a");
  if (air) { ell(ctx, 5.8, -7.0, 1.9, 1.3, "#8a1f1a", INK, 0.4); ell(ctx, 5.8, -6.5, 1, 0.55, "#ff8a80"); }
  else curve(ctx, 3.4, -7.4, 5.6, -6.0, 7.6, -8.0, INK, 0.65);
  // czerwona muszka
  polyO([2.4, -5.9, -0.2, -7.4, -0.2, -4.4], "#d8282e", INK, 0.5); polyO([2.4, -5.9, 5.0, -7.4, 5.0, -4.4], "#d8282e", INK, 0.5);
  ell(ctx, 2.4, -5.9, 0.9, 0.9, "#a81a20", INK, 0.4);
}

/* --- pętla --- */
let last = performance.now(), acc = 0, ftSum = 0, ftN = 0, slowCount = 0;
const STEP = 1000 / 60;
function frame(now) {
  const dt = now - last; last = now;
  acc += Math.min(100, dt);
  while (acc >= STEP) { game.update(); acc -= STEP; }
  Music.sync(game);
  render();
  // jeśli klatki trwają za długo, zmniejsz rozdzielczość bufora (mniej lagów na słabszych telefonach)
  if (!document.hidden && game.state === ST.PLAY && !game.paused) {
    ftSum += Math.min(dt, 200); ftN++;
    if (ftN >= 90) {
      if (ftSum / ftN > 26) {
        slowCount++;
        if (slowCount === 2 && !lite) lite = true;
        else if (qAdapt > 0.55) { qAdapt *= 0.8; resize(); }
      }
      ftSum = 0; ftN = 0;
    }
  }
  requestAnimationFrame(frame);
}
resize();
prewarmArt(0);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) {
  document.fonts.load("600 12px Fredoka", "ŁąęóśżźćńŚŻŹĆŃ×").catch(() => {});
}
</script>
